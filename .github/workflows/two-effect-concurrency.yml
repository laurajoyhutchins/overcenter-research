name: Overcenter two-effect concurrency proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/two-effect-concurrency.yml
      - experiments/two-effect-concurrency/authority.ts
      - experiments/two-effect-concurrency/agent.ts
      - experiments/two-effect-concurrency/recovery.ts
      - experiments/two-effect-concurrency/verify.ts
      - src/**
      - test/git-kernel.test.ts
      - experiments/disposable-agent/disposable-agent.test.ts
      - experiments/two-effect-concurrency/two-effect-concurrency.test.ts
      - package.json

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}


jobs:
  project-authority:
    name: Trusted authority — define and claim two effects
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Fresh checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Node 22.16
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: Regression and concurrency tests
        run: npm test

      - name: Define and claim both obligations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/two-effect-concurrency/authority.ts

  agent-alpha:
    name: Disposable Agent alpha
    needs: project-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    outputs:
      outcome: ${{ steps.agent.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Execute alpha and die
        id: agent
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLOT: alpha
        run: node --experimental-strip-types experiments/two-effect-concurrency/agent.ts
      - name: Supervisor confirms alpha terminated
        if: always()
        env:
          OUTCOME: ${{ steps.agent.outcome }}
        run: test "$OUTCOME" = "failure"

  agent-beta:
    name: Disposable Agent beta
    needs: project-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    outputs:
      outcome: ${{ steps.agent.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Execute beta and die
        id: agent
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLOT: beta
        run: node --experimental-strip-types experiments/two-effect-concurrency/agent.ts
      - name: Supervisor confirms beta terminated
        if: always()
        env:
          OUTCOME: ${{ steps.agent.outcome }}
        run: test "$OUTCOME" = "failure"

  recover-alpha:
    name: Recover alpha
    needs: [agent-alpha, agent-beta]
    if: ${{ always() && needs.agent-alpha.outputs.outcome == 'failure' && needs.agent-beta.outputs.outcome == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: read
    env:
      SLOT: alpha
      AGENT_OUTCOME: ${{ needs.agent-alpha.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Recover and settle alpha
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/two-effect-concurrency/recovery.ts

  recover-beta:
    name: Recover beta
    needs: [agent-alpha, agent-beta]
    if: ${{ always() && needs.agent-alpha.outputs.outcome == 'failure' && needs.agent-beta.outputs.outcome == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: read
    env:
      SLOT: beta
      AGENT_OUTCOME: ${{ needs.agent-beta.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Recover and settle beta
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/two-effect-concurrency/recovery.ts

  verify:
    name: Verify both settlements
    needs: [recover-alpha, recover-beta]
    if: ${{ always() && needs.recover-alpha.result == 'success' && needs.recover-beta.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Read final authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/two-effect-concurrency/verify.ts
