name: Formal transition kernel

on:
  pull_request:
    paths:
      - 'formal/**'
      - 'research/tla-formal-kernel.md'
      - '.github/workflows/formal-kernel.yml'
  push:
    branches:
      - main
    paths:
      - 'formal/**'
      - 'research/tla-formal-kernel.md'
      - '.github/workflows/formal-kernel.yml'

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check transition kernel and negative controls
        run: bash formal/check.sh
