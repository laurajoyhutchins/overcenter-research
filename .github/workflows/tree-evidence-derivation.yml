name: Tree evidence derivation proof

on:
  pull_request:
    paths:
      - '.github/workflows/tree-evidence-derivation.yml'
      - 'experiments/tree-evidence-derivation/**'
      - 'src/digest.ts'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Prove derived tree evidence remains distinct from revision evidence
        run: npm run test:tree-evidence-derivation
