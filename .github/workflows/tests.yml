name: Evidence

on:
  workflow_call:
    inputs:
      expensive:
        description: Run candidate-only adversarial, formal, production, and self-application evidence
        required: false
        type: boolean
        default: false
    outputs:
      candidate_evidence:
        description: Whether candidate-only evidence completed successfully
        value: ${{ jobs.evidence.outputs.candidate_evidence }}
      source_sha:
        description: Exact source SHA certified by the evidence run
        value: ${{ jobs.evidence.outputs.source_sha }}
  workflow_dispatch:
    inputs:
      expensive:
        description: Run candidate-only adversarial, formal, production, and self-application evidence
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  regression:
    name: Regression evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact evidence revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Verify experiment contracts
        run: npm run test:experiment-contract
      - name: Run deterministic regression
        run: npm run test:unit

  experiments:
    name: Experiment and formal evidence
    if: ${{ inputs.expensive }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact evidence revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Install Java for candidate formal proof
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Run adversarial experiment proofs
        run: npm run test:experiments
      - name: Run independent stress and TLA+ proofs concurrently
        shell: bash
        run: |
          set +e
          npm run test:stress &
          stress_pid=$!
          npm run proof:formal &
          formal_pid=$!
          wait "$stress_pid"
          stress_status=$?
          wait "$formal_pid"
          formal_status=$?
          set -e
          test "$stress_status" -eq 0
          test "$formal_status" -eq 0

  production:
    name: Production and self-application evidence
    if: ${{ inputs.expensive }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact evidence revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Install Go for candidate production evidence
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: '.go-version'
          cache: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --no-self-update
          test "$(rustc --version | awk '{print $2}')" = "$channel"
      - name: Prove production computation boundary
        env:
          OVERCENTER_PREVERIFIED_COMPUTATION_EXECUTOR: '1'
          OVERCENTER_KEEP_BUILD: '1'
        run: npm run proof:production-boundary
      - name: Prove self-application on the same exact revision
        env:
          OVERCENTER_REUSE_EXECUTOR: '1'
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/overcenter-self-application.json"
          image="overcenter-self-application:${{ github.run_id }}"
          bash scripts/proof-self-application.sh "$SOURCE_SHA" "$image" "$report"
          {
            echo '## Overcenter self-application'
            echo
            echo '### Report'
            sed 's/^/    /' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

  evidence:
    name: Candidate evidence
    if: ${{ always() }}
    needs: [regression, experiments, production]
    runs-on: ubuntu-slim
    timeout-minutes: 1
    outputs:
      candidate_evidence: ${{ steps.certificate.outputs.candidate_evidence }}
      source_sha: ${{ steps.certificate.outputs.source_sha }}
    env:
      EXPENSIVE: ${{ inputs.expensive }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REGRESSION_RESULT: ${{ needs.regression.result }}
      EXPERIMENTS_RESULT: ${{ needs.experiments.result }}
      PRODUCTION_RESULT: ${{ needs.production.result }}
    steps:
      - name: Require complete evidence
        run: |
          set -euo pipefail
          test "$REGRESSION_RESULT" = success
          if [ "$EXPENSIVE" = true ]; then
            test "$EXPERIMENTS_RESULT" = success
            test "$PRODUCTION_RESULT" = success
          else
            test "$EXPERIMENTS_RESULT" = skipped
            test "$PRODUCTION_RESULT" = skipped
          fi
      - name: Publish exact-head evidence certificate
        id: certificate
        run: |
          echo "candidate_evidence=$EXPENSIVE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
