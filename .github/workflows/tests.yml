name: Evidence

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Deterministic regression
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Verify experiment contracts
        run: npm run test:experiment-contract
      - name: Run deterministic regression
        run: npm run test:unit

  proofs:
    name: Adversarial, experimental, and formal proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Run adversarial experiment proofs
        run: npm run test:experiments
      - name: Run Git stress proof
        run: npm run test:stress
      - name: Run TLA+ safety proof
        run: npm run proof:formal
