name: Overcenter self-dogfood

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: overcenter-self-dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-evidence:
    name: Self-host deterministic evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OVERCENTER_DOGFOOD_IMAGE: overcenter-self-dogfood:${{ github.run_id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Build isolated dogfood executor
        run: |
          docker build \
            --build-arg "GO_VERSION=$(tr -d '[:space:]' < .go-version)" \
            --build-arg "NODE_VERSION=$(tr -d '[:space:]' < .node-version)" \
            -f executor/dogfood/Dockerfile \
            -t "$OVERCENTER_DOGFOOD_IMAGE" \
            .
      - name: Let Overcenter verify this exact revision
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/overcenter-self-dogfood.json"
          node --experimental-strip-types bin/dogfood-evidence.ts \
            --source-sha "$SOURCE_SHA" \
            --report "$report"
          {
            echo '## Overcenter self-dogfood'
            echo
            echo '### Report'
            sed 's/^/    /' "$report"
          } >> "$GITHUB_STEP_SUMMARY"
