name: Autonomy sandbox local-model proof

on:
  pull_request:
    paths:
      - '.github/workflows/autonomy-sandbox-local-model.yml'
      - 'experiments/codex-closed-loop/local-model-*'
      - 'experiments/codex-closed-loop/sandbox-runner.ts'
      - 'experiments/codex-closed-loop/sandbox-fixture/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomy-local-model-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MODEL_ID: Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF
  MODEL_REVISION: 0d4b0eeb9675b2da6dfaeb6fbf2ef1dff3e71e29
  MODEL_SHA256: 1d9614638d18024d0fbb36575a15f1302a3adf044df10345688ec4f6e1c4ff32
  RUNTIME_ID: llama.cpp/b10964
  RUNTIME_SHA256: 9abf88aea48a55d0f80edb1ee20220b186848cca0b4e919d71518cfd7ca67443

jobs:
  model:
    name: Disposable local reasoning worker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Download pinned public inference bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local-model/runtime" "$RUNNER_TEMP/local-model/out"
          curl --fail --location --retry 3             "https://github.com/ggml-org/llama.cpp/releases/download/b10964/llama-b10964-bin-ubuntu-x64.tar.gz"             -o "$RUNNER_TEMP/local-model/llama.tar.gz"
          echo "$RUNTIME_SHA256  $RUNNER_TEMP/local-model/llama.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/local-model/llama.tar.gz" -C "$RUNNER_TEMP/local-model/runtime"
          curl --fail --location --retry 3             "https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/$MODEL_REVISION/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf?download=true"             -o "$RUNNER_TEMP/local-model/model.gguf"
          echo "$MODEL_SHA256  $RUNNER_TEMP/local-model/model.gguf" | sha256sum --check -
      - name: Prepare byte-scoped unprivileged inference identity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local-model/input" "$RUNNER_TEMP/local-model/trusted"
          cp experiments/codex-closed-loop/local-model-prompt.txt "$RUNNER_TEMP/local-model/input/prompt.txt"
          cp experiments/codex-closed-loop/local-model-candidate.schema.json "$RUNNER_TEMP/local-model/input/schema.json"
          cp experiments/codex-closed-loop/local-model-normalize.mjs "$RUNNER_TEMP/local-model/trusted/normalize.mjs"
          chmod 0444 "$RUNNER_TEMP/local-model/input/prompt.txt" "$RUNNER_TEMP/local-model/input/schema.json"
          chmod 0700 "$RUNNER_TEMP/local-model/trusted"
          chmod 0600 "$RUNNER_TEMP/local-model/trusted/normalize.mjs"
          sudo useradd --no-create-home --shell /usr/sbin/nologin overcenter-model
          sandbox_root=/opt/overcenter-local-model
          sudo rm -rf "$sandbox_root"
          sudo install -d -o root -g root -m 0711 "$sandbox_root"
          sudo mv "$RUNNER_TEMP/local-model/runtime" "$sandbox_root/runtime"
          sudo mv "$RUNNER_TEMP/local-model/model.gguf" "$sandbox_root/model.gguf"
          sudo chown -R root:root "$sandbox_root/runtime" "$sandbox_root/model.gguf"
          sudo chmod -R a-w "$sandbox_root/runtime"
          sudo chmod 0444 "$sandbox_root/model.gguf"
          sudo install -d -o root -g root -m 0555 "$sandbox_root/input"
          sudo install -o root -g root -m 0444 "$RUNNER_TEMP/local-model/input/prompt.txt" "$sandbox_root/input/prompt.txt"
          sudo install -o root -g root -m 0444 "$RUNNER_TEMP/local-model/input/schema.json" "$sandbox_root/input/schema.json"
          sudo install -d -o overcenter-model -g overcenter-model -m 0700 "$sandbox_root/home"
          test -z "$(sudo find "$sandbox_root/runtime" ! -type l -perm /022 -print -quit)"
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -m 0700 "$GITHUB_WORKSPACE"
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -print -quit)"
      - name: Run one byte-scoped inference with networking physically disabled
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          sandbox_root=/opt/overcenter-local-model
          llama_cli="$(find "$sandbox_root/runtime" -type f -name llama-cli -perm -u+x | head -n 1)"
          test -n "$llama_cli"
          runtime_dir="$(dirname "$llama_cli")"
          model_uid="$(id -u overcenter-model)"
          model_gid="$(id -g overcenter-model)"
          sudo /usr/bin/unshare --net --fork --             /usr/bin/setpriv --reuid="$model_uid" --regid="$model_gid" --clear-groups             /usr/bin/env -i               PATH=/usr/bin:/bin               HOME="$sandbox_root/home"               LD_LIBRARY_PATH="$runtime_dir"               LLAMA_CLI="$llama_cli"               MODEL="$sandbox_root/model.gguf"               PROMPT="$sandbox_root/input/prompt.txt"               SCHEMA="$sandbox_root/input/schema.json"               /bin/sh -ceu '
                cd "$HOME"
                test "$(id -u)" -ne 0
                test "$(find /sys/class/net -mindepth 1 -maxdepth 1 -printf "%f\n" | grep -vc "^lo$")" -eq 0
                exec "$LLAMA_CLI"                   -m "$MODEL"                   -f "$PROMPT"                   --json-schema-file "$SCHEMA"                   --seed 20260921                   --temp 0                   --ctx-size 4096                   -n 1400                   --no-display-prompt                   --no-show-timings
              ' > "$RUNNER_TEMP/local-model/out/raw.txt"
      - name: Materialize candidate and provenance
        run: |
          set -euo pipefail
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -print -quit)"
          node "$RUNNER_TEMP/local-model/trusted/normalize.mjs"             "$RUNNER_TEMP/local-model/out/raw.txt"             "$RUNNER_TEMP/local-model/input/prompt.txt"             "$RUNNER_TEMP/local-model/out/candidate.json"             "$RUNNER_TEMP/local-model/out/provenance.json"
      - name: Upload untrusted candidate only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autonomy-local-model-candidate
          path: |
            ${{ runner.temp }}/local-model/out/candidate.json
            ${{ runner.temp }}/local-model/out/provenance.json
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Fresh trusted verification and settlement
    needs: model
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Install exact Rust confinement toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --no-self-update
          test "$(rustc --version | awk '{print $2}')" = "$channel"
          rustc --edition=2021 -D warnings runtime/overcenter-exec/main.rs -o "$RUNNER_TEMP/overcenter-exec"
          sudo install -o root -g root -m 0555 "$(command -v node)" "$RUNNER_TEMP/trusted-node"
          test "$(stat -c %u "$RUNNER_TEMP/trusted-node")" = 0
          test ! -w "$RUNNER_TEMP/trusted-node"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: autonomy-local-model-candidate
          path: ${{ runner.temp }}/local-model-candidate
      - name: Independently verify and settle through Overcenter
        env:
          OVERCENTER_SOURCE_REVISION: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trusted-node" --experimental-strip-types experiments/codex-closed-loop/sandbox-runner.ts             --stage single-useful-obligation             --seed local-model-20260921             --worker recorded-model             --candidate "$RUNNER_TEMP/local-model-candidate/candidate.json"             --provenance "$RUNNER_TEMP/local-model-candidate/provenance.json"             --launcher "$RUNNER_TEMP/overcenter-exec"             --evidence "$RUNNER_TEMP/local-model-evidence.json"
          EVIDENCE="$RUNNER_TEMP/local-model-evidence.json" node - <<'NODE'
          const fs=require('node:fs');
          const evidence=JSON.parse(fs.readFileSync(process.env.EVIDENCE,'utf8'));
          if (evidence.outcome!=='accepted') throw new Error('LOCAL_MODEL_CANDIDATE_REJECTED');
          if (evidence.capability_claim!=='uncertain-reasoning-stage1') throw new Error('LOCAL_MODEL_CLAIM_MISMATCH');
          if (evidence.worker.reasoning_process_confinement_proven!==true) throw new Error('LOCAL_MODEL_CONFINEMENT_NOT_PROVEN');
          if (evidence.worker.network_during_inference!==false) throw new Error('LOCAL_MODEL_NETWORK_NOT_DISABLED');
          if (evidence.worker.repository_credentials_present!==false) throw new Error('LOCAL_MODEL_CREDENTIAL_BOUNDARY_FAILED');
          if (evidence.worker.checkout_readable_during_inference!==false) throw new Error('LOCAL_MODEL_CHECKOUT_BOUNDARY_FAILED');
          if (evidence.worker.worker_uid_isolated!==true) throw new Error('LOCAL_MODEL_UID_BOUNDARY_FAILED');
          if (evidence.worker.input_scope!=='synthetic-prompt-and-schema-only') throw new Error('LOCAL_MODEL_INPUT_SCOPE_FAILED');
          if (evidence.candidate.execution_confinement_proven!==true) throw new Error('LOCAL_MODEL_CANDIDATE_EXECUTION_NOT_CONFINED');
          if (!evidence.candidate.execution_manifest_sha256) throw new Error('LOCAL_MODEL_EXECUTION_MANIFEST_MISSING');
          if (evidence.authority.disposition!=='DONE' || evidence.authority.verified!==true) throw new Error('LOCAL_MODEL_NOT_VERIFIED_DONE');
          if (evidence.metrics.false_done_count!==0) throw new Error('LOCAL_MODEL_FALSE_DONE');
          if (evidence.metrics.human_judgment_interventions!==0) throw new Error('LOCAL_MODEL_HUMAN_INTERVENTION');
          if (evidence.promotion_evidence.eligible!==false) throw new Error('LOCAL_MODEL_AUTO_PROMOTION_FORBIDDEN');
          console.log(JSON.stringify(evidence));
          NODE
      - name: Upload retained evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autonomy-local-model-evidence
          path: ${{ runner.temp }}/local-model-evidence.json
          if-no-files-found: error
          retention-days: 7
