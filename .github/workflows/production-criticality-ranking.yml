name: Production criticality ranking

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'experiments/**'
      - '.github/workflows/production-criticality-ranking.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Install pinned TypeScript analyzer
        run: npm install --no-save --ignore-scripts typescript@5.8.3 @types/node@22.20.4
      - name: Prove analyzer invariants
        run: node --test experiments/production-criticality-ranking/analyze.test.mjs
      - name: Rank production callables
        run: |
          node experiments/production-criticality-ranking/analyze.mjs \
            --config experiments/production-criticality-ranking/config.json \
            --json criticality.json \
            --markdown criticality.md
      - name: Prove exact recomputation
        run: |
          node experiments/production-criticality-ranking/analyze.mjs \
            --config experiments/production-criticality-ranking/config.json \
            --json criticality-repeat.json \
            --markdown criticality-repeat.md
          cmp criticality.json criticality-repeat.json
          cmp criticality.md criticality-repeat.md
      - name: Show ranking
        if: always()
        run: cat criticality.md || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-criticality-ranking
          path: |
            criticality.json
            criticality.md
          if-no-files-found: ignore
