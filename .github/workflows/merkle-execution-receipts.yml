name: Merkle execution receipts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/merkle-execution-receipts.yml
      - experiments/merkle-execution-receipts/**
      - experiments/registry.json
      - experiments/README.md
      - package.json
      - src/providers/github/status-effect.ts

permissions: {}

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  merkle-execution-receipts:
    name: Merkle receipt hostile-case experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Exact source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Node from repository
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: Experiment contract
        run: npm run test:experiment-contract

      - name: Merkle execution receipts experiment
        run: npm run test:merkle-execution-receipts
