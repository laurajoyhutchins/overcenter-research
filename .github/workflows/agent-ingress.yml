name: Overcenter agent mailbox

on:
  workflow_run:
    workflows: [Overcenter request signal]
    types: [completed]

permissions: {}

concurrency:
  group: overcenter-agent-mailbox
  cancel-in-progress: false

jobs:
  handle:
    name: Handle silent agent request
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'overcenter/request/') &&
      github.event.workflow_run.actor.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      REQUEST_REF: ${{ github.event.workflow_run.head_branch }}
      REQUEST_EVENT_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout trusted default-branch adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Node 22.16
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: Read and validate exact request commit
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request_sha="$REQUEST_EVENT_SHA"
          [[ "$request_sha" =~ ^[0-9a-f]{40}$ ]]

          git fetch --no-tags origin \
            "refs/heads/$REQUEST_REF:refs/overcenter/request-input"
          actual="$(git rev-parse refs/overcenter/request-input)"
          test "$actual" = "$request_sha"

          source_sha="$(git rev-parse "$request_sha^")"
          changed="$(git diff-tree --no-commit-id --name-only -r "$request_sha")"
          test "$changed" = ".overcenter/request.json"
          git show "$request_sha:.overcenter/request.json" > request.json

          REQUEST_SHA="$request_sha" SOURCE_SHA="$source_sha" node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('node:fs');
          const request=JSON.parse(fs.readFileSync('request.json','utf8'));
          const requestSha=process.env.REQUEST_SHA;
          const sourceSha=process.env.SOURCE_SHA;
          const exact=(keys)=>{
            const actual=Object.keys(request).sort();
            const expected=[...keys].sort();
            if (JSON.stringify(actual)!==JSON.stringify(expected)) {
              throw new Error('REQUEST_KEYS_INVALID');
            }
          };
          if (request.schema!=='overcenter-github-agent-request/v1') {
            throw new Error('REQUEST_SCHEMA_INVALID');
          }
          if (request.source_sha!==sourceSha) throw new Error('REQUEST_SOURCE_MISMATCH');
          if (request.operation==='acquire') {
            exact(['schema','operation','source_sha']);
          } else if (request.operation==='submit') {
            exact(['schema','operation','source_sha','target_request_sha','candidate_sha']);
            if (!/^[0-9a-f]{40}$/.test(request.target_request_sha)) {
              throw new Error('TARGET_REQUEST_SHA_INVALID');
            }
            if (!/^[0-9a-f]{40}$/.test(request.candidate_sha)) {
              throw new Error('CANDIDATE_SHA_INVALID');
            }
            console.log(`target_request_sha=${request.target_request_sha}`);
            console.log(`candidate_sha=${request.candidate_sha}`);
          } else {
            throw new Error('REQUEST_OPERATION_INVALID');
          }
          console.log(`request_sha=${requestSha}`);
          console.log(`source_sha=${sourceSha}`);
          console.log(`operation=${request.operation}`);
          NODE

      - name: Verify reusable assignment contract
        if: steps.request.outputs.operation == 'acquire'
        run: npm run test:assignment-capsule

      - name: Claim exact request and materialize assignment
        if: steps.request.outputs.operation == 'acquire'
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_sha }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p response/assignment
          node --experimental-strip-types bin/github-agent-ingress.ts \
            --capsule-dir response/assignment \
            --receipt response/response.json

      - name: Fetch exact untrusted candidate
        if: steps.request.outputs.operation == 'submit'
        env:
          CANDIDATE_SHA: ${{ steps.request.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/overcenter/candidate/$CANDIDATE_SHA:refs/overcenter/candidate-input"
          test "$(git rev-parse refs/overcenter/candidate-input)" = "$CANDIDATE_SHA"
          changed="$(git diff-tree --no-commit-id --name-only -r "$CANDIDATE_SHA")"
          test "$changed" = ".overcenter/candidate.json"

      - name: Validate candidate and settle through Overcenter
        if: steps.request.outputs.operation == 'submit'
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_sha }}
          TARGET_REQUEST_SHA: ${{ steps.request.outputs.target_request_sha }}
          CANDIDATE_SHA: ${{ steps.request.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          mkdir -p response
          node --experimental-strip-types bin/github-agent-submit.ts \
            --receipt response/response.json

      - name: Publish immutable connector-visible response
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_sha }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          node --experimental-strip-types bin/github-agent-publish-response.ts \
            --response-dir response
