name: Recovery agent search experiment

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'experiments/recovery-agent-search/**'
      - 'experiments/recovery-agent-refinement/**'
      - 'experiments/recovery-reasoning/**'
      - '.github/workflows/autonomy-sandbox-google-free.yml'
      - 'package.json'
      - 'experiments/registry.json'

permissions: {}

concurrency:
  group: recovery-agent-search-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  AI_SDK_VERSION: 7.0.107
  AI_SDK_GOOGLE_VERSION: 4.0.76
  GCP_IDENTITY_PROJECT_ID: project-6b810532-a302-48dc-b56
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/380435294892/locations/global/workloadIdentityPools/github-reasoning/providers/overcenter-research
  GCP_API_KEY_READER_SERVICE_ACCOUNT: oc-reasoning-key-reader@project-6b810532-a302-48dc-b56.iam.gserviceaccount.com
  GEMINI_KEY_ID: overcenter-google-free
  GEMINI_FREE_PROJECT_ID: ${{ vars.GEMINI_FREE_PROJECT_ID }}

jobs:
  prepare:
    name: Trusted benchmark - prepare public packets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      prompt_sha256: ${{ steps.packet.outputs.prompt_sha256 }}
      run_search: ${{ steps.mode.outputs.run_search }}
      run_refinement: ${{ steps.mode.outputs.run_refinement }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Detect experiment surface
        id: mode
        run: |
          set -euo pipefail
          changed_file="$RUNNER_TEMP/recovery-agent-changed-files"
          git diff --name-only "$BASE_SHA" "$SOURCE_SHA" > "$changed_file"
          run_search=false
          run_refinement=false
          if grep -qE '^experiments/(recovery-agent-search|recovery-reasoning)/' "$changed_file"; then
            run_search=true
          fi
          if grep -q '^experiments/recovery-agent-refinement/' "$changed_file"; then
            run_refinement=true
          fi
          if ! grep -qE '^experiments/(recovery-agent-search|recovery-reasoning|recovery-agent-refinement)/' "$changed_file"; then
            if grep -qxF '.github/workflows/autonomy-sandbox-google-free.yml' "$changed_file"; then
              run_search=true
              run_refinement=true
            fi
          fi
          echo "run_search=$run_search" >> "$GITHUB_OUTPUT"
          echo "run_refinement=$run_refinement" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Verify deterministic benchmark contracts
        run: |
          npm run test:recovery-agent-search
          npm run test:recovery-agent-refinement
      - name: Build model-visible assignment
        if: steps.mode.outputs.run_search == 'true'
        id: packet
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/recovery-agent-assignment"
          mkdir -p "$root"
          cp experiments/recovery-agent-search/proposal.schema.json "$root/proposal.schema.json"
          cp experiments/recovery-agent-search/google-free-candidate.ts "$root/google-free-candidate.ts"
          node - <<'NODE' > "$root/prompt.md"
          const fs=require('node:fs');
          const packets=JSON.parse(fs.readFileSync('experiments/recovery-agent-search/packets.json','utf8'));
          const lines=[
            'You are an untrusted recovery-search reasoner in an Overcenter experiment.',
            '',
            'Your only job is to synthesize search parameters that trusted software may later execute.',
            'You do not know the authoritative audit corpus and you cannot settle, retry, or assert what happened.',
            'Return exactly one proposal for every case in the packet below.',
            '',
            'Allowed field names: '+packets.query_contract.allowed_fields.join(', '),
            'Allowed operations: '+packets.query_contract.allowed_operations.join(', '),
            'Conventions:',
            ...packets.query_contract.conventions.map(x=>'- '+x),
            '',
            'Rules:',
            '- Never assert certainty, outcome, provider state, provider record identity, or a retry.',
            '- Use ordinary reasoning over the packet prose to synthesize provider search fields.',
            '- Prefer enough fields to isolate the intended effect rather than broad guesses.',
            '- If the packet says authoritative recovery is impossible, choose unresolved.',
            '',
            'Recovery packets:',
            JSON.stringify(packets.cases,null,2),
          ];
          process.stdout.write(lines.join('\n')+'\n');
          NODE
          prompt_sha256="$(sha256sum "$root/prompt.md" | cut -d' ' -f1)"
          echo "prompt_sha256=$prompt_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.mode.outputs.run_search == 'true'
        with:
          name: recovery-agent-assignment
          path: ${{ runner.temp }}/recovery-agent-assignment
          if-no-files-found: error
          retention-days: 1

  worker:
    name: Untrusted Google-free reasoner - propose searches
    needs: prepare
    if: needs.prepare.outputs.run_search == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: recovery-agent-assignment
          path: ${{ runner.temp }}/recovery-agent-assignment
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.16.0
      - name: Verify public assignment and free-project coordinate
        env:
          EXPECTED_PROMPT_SHA256: ${{ needs.prepare.outputs.prompt_sha256 }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/recovery-agent-assignment"
          test "$(sha256sum "$root/prompt.md" | cut -d' ' -f1)" = "$EXPECTED_PROMPT_SHA256"
          test ! -e "$root/oracle.json"
          test -n "$GEMINI_FREE_PROJECT_ID"
          [[ "$GEMINI_FREE_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
      - id: google-auth
        name: Exchange GitHub OIDC for short-lived Google credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_IDENTITY_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_API_KEY_READER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false
      - id: free-project
        name: Prove Gemini project is still unbilled
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/recovery-google-free"
          mkdir -p "$root"
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN"             "https://cloudbilling.googleapis.com/v1/projects/$GEMINI_FREE_PROJECT_ID/billingInfo"             -o "$root/billing.json"
          BILLING="$root/billing.json" node - <<'NODE'
          const fs=require('node:fs');
          const billing=JSON.parse(fs.readFileSync(process.env.BILLING,'utf8'));
          if (billing.billingEnabled!==false) throw new Error('GEMINI_PROJECT_BILLING_ENABLED');
          NODE
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN"             "https://cloudresourcemanager.googleapis.com/v1/projects/$GEMINI_FREE_PROJECT_ID"             -o "$root/project.json"
          PROJECT="$root/project.json" KEY_ID="$GEMINI_KEY_ID" node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('node:fs');
          const project=JSON.parse(fs.readFileSync(process.env.PROJECT,'utf8'));
          const number=String(project.projectNumber||'');
          if (!/^[0-9]+$/.test(number)) throw new Error('GEMINI_PROJECT_NUMBER_INVALID');
          console.log('project_number='+number);
          console.log('key_resource=projects/'+number+'/locations/global/keys/'+process.env.KEY_ID);
          NODE
      - name: Prepare byte-scoped AI SDK runtime
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/recovery-agent-assignment"
          root="$RUNNER_TEMP/recovery-google-free"
          sandbox_root=/opt/overcenter-recovery-google-free
          mkdir -p "$root/runtime" "$root/input" "$root/out"
          cp "$source_root/google-free-candidate.ts" "$root/runtime/google-free-candidate.ts"
          cp "$source_root/prompt.md" "$root/input/prompt.md"
          cp "$source_root/proposal.schema.json" "$root/input/proposal.schema.json"
          npm install --prefix "$root/runtime" --ignore-scripts --no-package-lock --no-save             "ai@$AI_SDK_VERSION" "@ai-sdk/google@$AI_SDK_GOOGLE_VERSION"
          npm --prefix "$root/runtime" ls --depth=0 ai @ai-sdk/google
          sudo useradd --no-create-home --shell /usr/sbin/nologin overcenter-model
          sudo rm -rf "$sandbox_root"
          sudo install -d -o root -g root -m 0711 "$sandbox_root"
          sudo mv "$root/runtime" "$sandbox_root/runtime"
          sudo mv "$root/input" "$sandbox_root/input"
          sudo chown -R root:root "$sandbox_root/runtime" "$sandbox_root/input"
          sudo chmod -R a+rX,u-w,g-w,o-w "$sandbox_root/runtime" "$sandbox_root/input"
          sudo install -d -o overcenter-model -g overcenter-model -m 0700 "$sandbox_root/out" "$sandbox_root/home"
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -m 0700 "$GITHUB_WORKSPACE"
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -print -quit)"
      - name: Resolve Gemini auth key from Google API Keys
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          GEMINI_API_KEY_RESOURCE: ${{ steps.free-project.outputs.key_resource }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/recovery-google-free"
          [[ "$GEMINI_API_KEY_RESOURCE" =~ ^projects/[0-9]+/locations/global/keys/overcenter-google-free$ ]]
          key_http="$(curl --silent --show-error -o "$root/key-response.json" -w '%{http_code}'             -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN"             -H "x-goog-user-project: $GEMINI_FREE_PROJECT_ID"             "https://apikeys.googleapis.com/v2/$GEMINI_API_KEY_RESOURCE/keyString")"
          if [[ "$key_http" != "200" ]]; then
            cat "$root/key-response.json" >&2
            exit 1
          fi
          RESPONSE="$root/key-response.json" KEY="$root/gemini-api-key" node - <<'NODE'
          const fs=require('node:fs');
          const response=JSON.parse(fs.readFileSync(process.env.RESPONSE,'utf8'));
          if (typeof response.keyString!=='string' || response.keyString.length<8) {
            throw new Error('GEMINI_API_KEY_STRING_MISSING');
          }
          fs.writeFileSync(process.env.KEY,response.keyString,{mode:0o600,flag:'wx'});
          NODE
          rm -f "$root/key-response.json"
          echo "::add-mask::$(cat "$root/gemini-api-key")"
      - name: Run oracle-blind Google-free inference
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          root="$RUNNER_TEMP/recovery-google-free"
          sandbox_root=/opt/overcenter-recovery-google-free
          test -s "$root/gemini-api-key"
          model_uid="$(id -u overcenter-model)"
          model_gid="$(id -g overcenter-model)"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          node_bin="$(readlink -f "$(command -v node)")"
          sudo -u overcenter-model test -r "$sandbox_root/runtime/google-free-candidate.ts"
          sudo -u overcenter-model test -r "$sandbox_root/input/prompt.md"
          sudo -u overcenter-model test -r "$sandbox_root/input/proposal.schema.json"
          test ! -e "$sandbox_root/input/oracle.json"
          gemini_key="$(cat "$root/gemini-api-key")"
          cleanup() {
            rm -f "$root/gemini-api-key"
            unset gemini_key
          }
          trap cleanup EXIT
          sudo /usr/bin/setpriv             --reuid="$model_uid"             --regid="$model_gid"             --clear-groups             /usr/bin/env -i               PATH=/usr/bin:/bin               HOME="$sandbox_root/home"               GOOGLE_GENERATIVE_AI_API_KEY="$gemini_key"               OVERCENTER_REASONING_CREDENTIAL_SOURCE=gcp-api-keys-via-github-oidc               OVERCENTER_REASONING_BILLING_PROJECT_ID="$GEMINI_FREE_PROJECT_ID"               OVERCENTER_REASONING_BILLING_OBSERVATION_SOURCE=google-cloud-billing-api               OVERCENTER_REASONING_BILLING_ENABLED=false               "$node_bin" --experimental-strip-types                 "$sandbox_root/runtime/google-free-candidate.ts"                 --prompt "$sandbox_root/input/prompt.md"                 --schema "$sandbox_root/input/proposal.schema.json"                 --candidate "$sandbox_root/out/candidate.json"                 --provenance "$sandbox_root/out/provenance.json"
          sudo install -o "$runner_uid" -g "$runner_gid" -m 0600 "$sandbox_root/out/candidate.json" "$root/out/candidate.json"
          sudo install -o "$runner_uid" -g "$runner_gid" -m 0600 "$sandbox_root/out/provenance.json" "$root/out/provenance.json"
          cleanup
          trap - EXIT
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -print -quit)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-agent-candidate
          path: |
            ${{ runner.temp }}/recovery-google-free/out/candidate.json
            ${{ runner.temp }}/recovery-google-free/out/provenance.json
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Trusted benchmark - validate and score
    needs: [prepare, worker]
    if: needs.prepare.outputs.run_search == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Re-run deterministic contract at exact source revision
        run: npm run test:recovery-agent-search
      - name: Verify reasoning provenance
        run: |
          PROVENANCE="$RUNNER_TEMP/recovery-agent-candidate/provenance.json" node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync(process.env.PROVENANCE,'utf8'));
          if (p.provider!=='google.generative-ai') throw new Error('RECOVERY_AGENT_PROVIDER_MISMATCH');
          if (p.model_id!=='gemini-3.8-flash') throw new Error('RECOVERY_AGENT_MODEL_MISMATCH');
          if (p.credential_source!=='gcp-api-keys-via-github-oidc') throw new Error('RECOVERY_AGENT_CREDENTIAL_MISMATCH');
          if (p.billing_project_id!==process.env.GEMINI_FREE_PROJECT_ID) throw new Error('RECOVERY_AGENT_BILLING_PROJECT_MISMATCH');
          if (p.billing_enabled!==false) throw new Error('RECOVERY_AGENT_BILLING_ENABLED');
          if (p.repository_credentials_present!==false) throw new Error('RECOVERY_AGENT_REPOSITORY_CREDENTIALS');
          if (p.checkout_readable_during_inference!==false) throw new Error('RECOVERY_AGENT_CHECKOUT_READABLE');
          if (p.overcenter_authority_present!==false) throw new Error('RECOVERY_AGENT_AUTHORITY_PRESENT');
          if (p.provider_mutation_authority_present!==false) throw new Error('RECOVERY_AGENT_MUTATION_AUTHORITY_PRESENT');
          NODE
      - name: Score untrusted proposal through trusted oracle
        run: |
          set -euo pipefail
          node experiments/recovery-agent-search/score.mjs             "$RUNNER_TEMP/recovery-agent-candidate/candidate.json"             "$RUNNER_TEMP/recovery-agent-result.json"
      - name: Publish result summary
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/recovery-agent-result.json','utf8'));
          console.log('## Recovery agent search result');
          console.log('');
          console.log('- deterministic baseline: '+r.baseline_resolved+'/'+r.recoverable_cases);
          console.log('- reasoning agent: '+r.agent_resolved+'/'+r.recoverable_cases);
          console.log('- recovery delta: '+(r.recovery_delta>=0?'+':'')+r.recovery_delta);
          console.log('- false certainty: '+r.false_certainty);
          console.log('- permanent-uncertainty violations: '+r.permanent_uncertainty_violations);
          console.log('- rejected proposals: '+r.rejected_agent_proposals.length);
          console.log('- interpretation: '+r.hypothesis);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-agent-search-result
          path: |
            ${{ runner.temp }}/recovery-agent-result.json
            ${{ runner.temp }}/recovery-agent-candidate/provenance.json
          if-no-files-found: error
          retention-days: 30
  refinement_observe:
    name: Trusted search - sanitize refinement feedback
    needs: prepare
    if: needs.prepare.outputs.run_refinement == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      prompt_sha256: ${{ steps.packet.outputs.prompt_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Execute trusted read-only search and sanitize observations
        id: packet
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/recovery-agent-refinement-round-two-assignment"
          mkdir -p "$root"
          node experiments/recovery-agent-refinement/observe.mjs \
            experiments/recovery-agent-refinement/round-one-candidate.json \
            "$root/observations.json"
          cp experiments/recovery-agent-search/proposal.schema.json "$root/proposal.schema.json"
          cp experiments/recovery-agent-search/google-free-candidate.ts "$root/google-free-candidate.ts"
          PACKETS=experiments/recovery-agent-search/packets.json OBS="$root/observations.json" node - <<'NODE' > "$root/prompt.md"
          const fs=require('node:fs');
          const packets=JSON.parse(fs.readFileSync(process.env.PACKETS,'utf8'));
          const observations=JSON.parse(fs.readFileSync(process.env.OBS,'utf8'));
          const lines=[
            'You are an untrusted recovery-search reasoner in the second and final round of an Overcenter experiment.',
            '',
            'Trusted software executed your prior read-only search proposals and returned only search cardinality.',
            'You still do not know the authoritative records, whether a unique record is the intended effect, or what actually happened.',
            'Return exactly one replacement proposal for every case.',
            '',
            'Allowed field names: '+packets.query_contract.allowed_fields.join(', '),
            'Allowed operations: '+packets.query_contract.allowed_operations.join(', '),
            'Conventions:',
            ...packets.query_contract.conventions.map(x=>'- '+x),
            '',
            'Cardinality meanings:',
            '- zero: the prior query matched no authoritative records.',
            '- one: the prior query matched exactly one authoritative record. This is NOT settlement evidence.',
            '- many: the prior query matched more than one authoritative record.',
            '- not-searched: no admissible search was executed.',
            '',
            'Rules:',
            '- This is the final refinement round. There is no third query.',
            '- You may retain, widen, narrow, replace, or abandon the prior search hypothesis.',
            '- Never assert certainty, outcome, provider state, provider record identity, settlement, or retry.',
            '- Use only the public packet, provider conventions, prior proposal, and cardinality shown below.',
            '- If authoritative recovery is impossible, choose unresolved.',
            '',
            'Recovery packets:',
            JSON.stringify(packets.cases,null,2),
            '',
            'Round-one sanitized observations:',
            JSON.stringify(observations.observations,null,2),
          ];
          process.stdout.write(lines.join('\n')+'\n');
          NODE
          grep -q '"cardinality"' "$root/prompt.md"
          ! grep -Eq 'matched_record|effect_digest|expected_effect_digest|"certainty"|"resolved"|"reason"|"outcome"' "$root/prompt.md"
          prompt_sha256="$(sha256sum "$root/prompt.md" | cut -d' ' -f1)"
          echo "prompt_sha256=$prompt_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-agent-refinement-round-two-assignment
          path: ${{ runner.temp }}/recovery-agent-refinement-round-two-assignment
          if-no-files-found: error
          retention-days: 1

  refinement_worker:
    name: Untrusted Google-free reasoner - refine searches
    needs: refinement_observe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: recovery-agent-refinement-round-two-assignment
          path: ${{ runner.temp }}/recovery-agent-refinement-round-two-assignment
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.16.0
      - name: Verify public assignment and free-project coordinate
        env:
          EXPECTED_PROMPT_SHA256: ${{ needs.refinement_observe.outputs.prompt_sha256 }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/recovery-agent-refinement-round-two-assignment"
          test "$(sha256sum "$root/prompt.md" | cut -d' ' -f1)" = "$EXPECTED_PROMPT_SHA256"
          test ! -e "$root/oracle.json"
          test -n "$GEMINI_FREE_PROJECT_ID"
          [[ "$GEMINI_FREE_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
      - id: google-auth
        name: Exchange GitHub OIDC for short-lived Google credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_IDENTITY_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_API_KEY_READER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false
      - id: free-project
        name: Prove Gemini project is still unbilled
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/recovery-google-free"
          mkdir -p "$root"
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN"             "https://cloudbilling.googleapis.com/v1/projects/$GEMINI_FREE_PROJECT_ID/billingInfo"             -o "$root/billing.json"
          BILLING="$root/billing.json" node - <<'NODE'
          const fs=require('node:fs');
          const billing=JSON.parse(fs.readFileSync(process.env.BILLING,'utf8'));
          if (billing.billingEnabled!==false) throw new Error('GEMINI_PROJECT_BILLING_ENABLED');
          NODE
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN"             "https://cloudresourcemanager.googleapis.com/v1/projects/$GEMINI_FREE_PROJECT_ID"             -o "$root/project.json"
          PROJECT="$root/project.json" KEY_ID="$GEMINI_KEY_ID" node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('node:fs');
          const project=JSON.parse(fs.readFileSync(process.env.PROJECT,'utf8'));
          const number=String(project.projectNumber||'');
          if (!/^[0-9]+$/.test(number)) throw new Error('GEMINI_PROJECT_NUMBER_INVALID');
          console.log('project_number='+number);
          console.log('key_resource=projects/'+number+'/locations/global/keys/'+process.env.KEY_ID);
          NODE
      - name: Prepare byte-scoped AI SDK runtime
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/recovery-agent-refinement-round-two-assignment"
          root="$RUNNER_TEMP/recovery-google-free"
          sandbox_root=/opt/overcenter-recovery-google-free
          mkdir -p "$root/runtime" "$root/input" "$root/out"
          cp "$source_root/google-free-candidate.ts" "$root/runtime/google-free-candidate.ts"
          cp "$source_root/prompt.md" "$root/input/prompt.md"
          cp "$source_root/proposal.schema.json" "$root/input/proposal.schema.json"
          npm install --prefix "$root/runtime" --ignore-scripts --no-package-lock --no-save             "ai@$AI_SDK_VERSION" "@ai-sdk/google@$AI_SDK_GOOGLE_VERSION"
          npm --prefix "$root/runtime" ls --depth=0 ai @ai-sdk/google
          sudo useradd --no-create-home --shell /usr/sbin/nologin overcenter-model
          sudo rm -rf "$sandbox_root"
          sudo install -d -o root -g root -m 0711 "$sandbox_root"
          sudo mv "$root/runtime" "$sandbox_root/runtime"
          sudo mv "$root/input" "$sandbox_root/input"
          sudo chown -R root:root "$sandbox_root/runtime" "$sandbox_root/input"
          sudo chmod -R a+rX,u-w,g-w,o-w "$sandbox_root/runtime" "$sandbox_root/input"
          sudo install -d -o overcenter-model -g overcenter-model -m 0700 "$sandbox_root/out" "$sandbox_root/home"
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -m 0700 "$GITHUB_WORKSPACE"
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -print -quit)"
      - name: Resolve Gemini auth key from Google API Keys
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          GEMINI_API_KEY_RESOURCE: ${{ steps.free-project.outputs.key_resource }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/recovery-google-free"
          [[ "$GEMINI_API_KEY_RESOURCE" =~ ^projects/[0-9]+/locations/global/keys/overcenter-google-free$ ]]
          key_http="$(curl --silent --show-error -o "$root/key-response.json" -w '%{http_code}'             -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN"             -H "x-goog-user-project: $GEMINI_FREE_PROJECT_ID"             "https://apikeys.googleapis.com/v2/$GEMINI_API_KEY_RESOURCE/keyString")"
          if [[ "$key_http" != "200" ]]; then
            cat "$root/key-response.json" >&2
            exit 1
          fi
          RESPONSE="$root/key-response.json" KEY="$root/gemini-api-key" node - <<'NODE'
          const fs=require('node:fs');
          const response=JSON.parse(fs.readFileSync(process.env.RESPONSE,'utf8'));
          if (typeof response.keyString!=='string' || response.keyString.length<8) {
            throw new Error('GEMINI_API_KEY_STRING_MISSING');
          }
          fs.writeFileSync(process.env.KEY,response.keyString,{mode:0o600,flag:'wx'});
          NODE
          rm -f "$root/key-response.json"
          echo "::add-mask::$(cat "$root/gemini-api-key")"
      - name: Run final oracle-blind refinement inference
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          root="$RUNNER_TEMP/recovery-google-free"
          sandbox_root=/opt/overcenter-recovery-google-free
          test -s "$root/gemini-api-key"
          model_uid="$(id -u overcenter-model)"
          model_gid="$(id -g overcenter-model)"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          node_bin="$(readlink -f "$(command -v node)")"
          sudo -u overcenter-model test -r "$sandbox_root/runtime/google-free-candidate.ts"
          sudo -u overcenter-model test -r "$sandbox_root/input/prompt.md"
          sudo -u overcenter-model test -r "$sandbox_root/input/proposal.schema.json"
          test ! -e "$sandbox_root/input/oracle.json"
          gemini_key="$(cat "$root/gemini-api-key")"
          cleanup() {
            rm -f "$root/gemini-api-key"
            unset gemini_key
          }
          trap cleanup EXIT
          sudo /usr/bin/setpriv             --reuid="$model_uid"             --regid="$model_gid"             --clear-groups             /usr/bin/env -i               PATH=/usr/bin:/bin               HOME="$sandbox_root/home"               GOOGLE_GENERATIVE_AI_API_KEY="$gemini_key"               OVERCENTER_REASONING_CREDENTIAL_SOURCE=gcp-api-keys-via-github-oidc               OVERCENTER_REASONING_BILLING_PROJECT_ID="$GEMINI_FREE_PROJECT_ID"               OVERCENTER_REASONING_BILLING_OBSERVATION_SOURCE=google-cloud-billing-api               OVERCENTER_REASONING_BILLING_ENABLED=false               "$node_bin" --experimental-strip-types                 "$sandbox_root/runtime/google-free-candidate.ts"                 --prompt "$sandbox_root/input/prompt.md"                 --schema "$sandbox_root/input/proposal.schema.json"                 --candidate "$sandbox_root/out/candidate.json"                 --provenance "$sandbox_root/out/provenance.json"
          sudo install -o "$runner_uid" -g "$runner_gid" -m 0600 "$sandbox_root/out/candidate.json" "$root/out/candidate.json"
          sudo install -o "$runner_uid" -g "$runner_gid" -m 0600 "$sandbox_root/out/provenance.json" "$root/out/provenance.json"
          cleanup
          trap - EXIT
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -print -quit)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-agent-refinement-round-two-candidate
          path: |
            ${{ runner.temp }}/recovery-google-free/out/candidate.json
            ${{ runner.temp }}/recovery-google-free/out/provenance.json
          if-no-files-found: error
          retention-days: 1


  refinement_verify:
    name: Trusted benchmark - score bounded refinement
    needs: [prepare, refinement_observe, refinement_worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: recovery-agent-refinement-round-two-candidate
          path: ${{ runner.temp }}/round-two
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: recovery-agent-refinement-round-two-assignment
          path: ${{ runner.temp }}/round-two-assignment
      - name: Re-run deterministic contracts at exact source revision
        run: |
          npm run test:recovery-agent-search
          npm run test:recovery-agent-refinement
      - name: Verify both reasoning provenance records
        run: |
          for provenance in experiments/recovery-agent-refinement/round-one-provenance.json "$RUNNER_TEMP/round-two/provenance.json"; do
            PROVENANCE="$provenance" node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync(process.env.PROVENANCE,'utf8'));
          if (p.provider!=='google.generative-ai') throw new Error('RECOVERY_AGENT_PROVIDER_MISMATCH');
          if (p.model_id!=='gemini-3.8-flash') throw new Error('RECOVERY_AGENT_MODEL_MISMATCH');
          if (p.credential_source!=='gcp-api-keys-via-github-oidc') throw new Error('RECOVERY_AGENT_CREDENTIAL_MISMATCH');
          if (p.billing_project_id!==process.env.GEMINI_FREE_PROJECT_ID) throw new Error('RECOVERY_AGENT_BILLING_PROJECT_MISMATCH');
          if (p.billing_enabled!==false) throw new Error('RECOVERY_AGENT_BILLING_ENABLED');
          if (p.repository_credentials_present!==false) throw new Error('RECOVERY_AGENT_REPOSITORY_CREDENTIALS');
          if (p.checkout_readable_during_inference!==false) throw new Error('RECOVERY_AGENT_CHECKOUT_READABLE');
          if (p.overcenter_authority_present!==false) throw new Error('RECOVERY_AGENT_AUTHORITY_PRESENT');
          if (p.provider_mutation_authority_present!==false) throw new Error('RECOVERY_AGENT_MUTATION_AUTHORITY_PRESENT');
          NODE
          done
      - name: Verify cardinality-only second-round surface
        run: |
          prompt="$RUNNER_TEMP/round-two-assignment/prompt.md"
          grep -q '"cardinality"' "$prompt"
          ! grep -Eq 'matched_record|effect_digest|expected_effect_digest|"certainty"|"resolved"|"reason"|"outcome"' "$prompt"
      - name: Score cumulative two-round recovery through trusted oracle
        run: |
          set -euo pipefail
          node experiments/recovery-agent-refinement/score.mjs \
            experiments/recovery-agent-refinement/round-one-candidate.json \
            "$RUNNER_TEMP/round-two/candidate.json" \
            "$RUNNER_TEMP/recovery-agent-refinement-result.json"
      - name: Publish refinement result summary
        run: |
          RESULT="$RUNNER_TEMP/recovery-agent-refinement-result.json" node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync(process.env.RESULT,'utf8'));
          console.log('## Recovery agent refinement result');
          console.log('');
          console.log('- deterministic baseline: '+r.deterministic_baseline_resolved+'/'+r.recoverable_cases);
          console.log('- round one: '+r.round_one_resolved+'/'+r.recoverable_cases);
          console.log('- round two alone: '+r.round_two_resolved+'/'+r.recoverable_cases);
          console.log('- cumulative two round: '+r.cumulative_two_round_resolved+'/'+r.recoverable_cases);
          console.log('- refinement gain: '+(r.refinement_gain>=0?'+':'')+r.refinement_gain);
          console.log('- baseline gain: '+(r.baseline_gain>=0?'+':'')+r.baseline_gain);
          console.log('- false certainty: '+r.false_certainty);
          console.log('- permanent-uncertainty violations: '+r.permanent_uncertainty_violations);
          console.log('- mechanism supported: '+r.mechanism_supported);
          console.log('- role supported: '+r.role_supported);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-agent-refinement-result
          path: |
            ${{ runner.temp }}/recovery-agent-refinement-result.json
            experiments/recovery-agent-refinement/round-one-source.json
            experiments/recovery-agent-refinement/round-one-provenance.json
            ${{ runner.temp }}/round-two/provenance.json
            ${{ runner.temp }}/round-two-assignment/observations.json
          if-no-files-found: error
          retention-days: 30
