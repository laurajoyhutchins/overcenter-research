name: LinkML contract refactor experiment

on:
  pull_request:
    paths:
      - 'experiments/linkml-contract-refactor/**'
      - 'experiments/registry.json'
      - 'experiments/README.md'
      - '.github/workflows/linkml-contract-refactor.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.PROOF_SOURCE_SHA }}
      - name: Verify exact experiment revision
        run: test "$(git rev-parse HEAD)" = "$PROOF_SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Install exact LinkML 1.11.1 root package
        run: |
          python3 --version
          mkdir -p /tmp/linkml-wheel
          python3 -m pip download --disable-pip-version-check --no-deps --only-binary=:all: linkml==1.11.1 -d /tmp/linkml-wheel
          echo 'd1bbb97a8b1ea4a99b145007875733a5e5e89b3acfe3e9d1e369fa4a582990ed  /tmp/linkml-wheel/linkml-1.11.1-py3-none-any.whl' | sha256sum -c -
          python3 -m pip install --disable-pip-version-check /tmp/linkml-wheel/linkml-1.11.1-py3-none-any.whl
          linkml-validate --version
      - run: node --experimental-strip-types --test experiments/linkml-contract-refactor/comparison.test.ts
