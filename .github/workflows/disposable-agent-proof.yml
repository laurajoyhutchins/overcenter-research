name: Overcenter disposable-agent proof

on:
  push:
    branches:
      - prototype/git-object-database
    paths:
      - .github/workflows/disposable-agent-proof.yml
      - actions/disposable-agent-a.ts
      - actions/disposable-agent-b.ts
      - src/git-kernel.ts

permissions:
  contents: write

jobs:
  agent-a:
    name: Agent A — claim, effect, terminate
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.agent.outcome }}

    steps:
      - name: Fresh checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node 22.16
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0

      - name: Run disposable Agent A
        id: agent
        continue-on-error: true
        run: node --experimental-strip-types actions/disposable-agent-a.ts

      - name: Supervisor confirms Agent A terminated
        if: always()
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: |
          test "$AGENT_OUTCOME" = "failure"
          test -n "$(git ls-remote origin refs/overcenter/state)"

  agent-b:
    name: Agent B — reconstruct and settle
    needs: agent-a
    if: ${{ always() && needs.agent-a.outputs.outcome == 'failure' }}
    runs-on: ubuntu-latest
    env:
      AGENT_A_OUTCOME: ${{ needs.agent-a.outputs.outcome }}

    steps:
      - name: Fresh checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node 22.16
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0

      - name: Reconstruct from Git and settle
        run: node --experimental-strip-types actions/disposable-agent-b.ts
