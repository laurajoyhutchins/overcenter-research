name: Overcenter disposable-agent trust proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/disposable-agent-proof.yml
      - experiments/disposable-agent/authority.ts
      - experiments/disposable-agent/agent-a.ts
      - experiments/disposable-agent/agent-b.ts
      - src/git-kernel.ts
      - test/git-kernel.test.ts
      - experiments/disposable-agent/disposable-agent.test.ts
      - README.md

permissions: {}

env:
  STATE_REF: refs/overcenter/disposable-runs/${{ github.run_id }}/${{ github.run_attempt }}

jobs:
  project-authority:
    name: Trusted project authority — define and claim
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Fresh checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node 22.16
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0

      - name: Focused regression suite
        run: npm test

      - name: Define immutable obligation and claim exact snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/disposable-agent/authority.ts

  agent-a:
    name: Agent A — authority-untrusted sandbox, provider effect, terminate
    needs: project-authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    outputs:
      outcome: ${{ steps.agent.outcome }}

    steps:
      - name: Fresh checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node 22.16
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0

      - name: Run disposable Agent A with sandbox tampering
        id: agent
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/disposable-agent/agent-a.ts

      - name: Supervisor confirms Agent A terminated
        if: always()
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: test "$AGENT_OUTCOME" = "failure"

  agent-b:
    name: Trusted recovery — canonical provider readback and settlement
    needs: agent-a
    if: ${{ always() && needs.agent-a.outputs.outcome == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: read
    env:
      AGENT_A_OUTCOME: ${{ needs.agent-a.outputs.outcome }}

    steps:
      - name: Fresh checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node 22.16
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0

      - name: Reconstruct immutable intent and settle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/disposable-agent/agent-b.ts
