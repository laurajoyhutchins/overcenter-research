name: Overcenter disposable-agent trust proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/disposable-agent-proof.yml
      - experiments/disposable-agent/authority.ts
      - experiments/disposable-agent/agent-a.ts
      - experiments/disposable-agent/effect-broker.ts
      - experiments/disposable-agent/agent-b.ts
      - src/**
      - test/git-kernel.test.ts
      - experiments/disposable-agent/disposable-agent.test.ts
      - README.md
      - ARCHITECTURE.md
      - experiments/README.md
      - research/claims.md
      - research/proof-obligations.md
  push:
    branches:
      - main
    paths:
      - .github/workflows/disposable-agent-proof.yml
      - experiments/disposable-agent/authority.ts
      - experiments/disposable-agent/agent-a.ts
      - experiments/disposable-agent/effect-broker.ts
      - experiments/disposable-agent/agent-b.ts
      - src/**
      - test/git-kernel.test.ts
      - experiments/disposable-agent/disposable-agent.test.ts
      - README.md
      - ARCHITECTURE.md
      - experiments/README.md
      - research/claims.md
      - research/proof-obligations.md

permissions: {}

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  project-authority:
    name: Trusted project authority — define and claim
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Fresh checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Node 22.16
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: Focused regression suite
        run: npm test

      - name: Define immutable obligation, claim, and bind dispatch session
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/disposable-agent/authority.ts

      - name: Upload trusted dispatch session
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: disposable-agent-task-session
          path: task-session.json
          if-no-files-found: error
          retention-days: 1

  agent-a:
    name: Agent A — authority-untrusted worker, emit result, terminate
    needs: project-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.agent.outcome }}

    steps:
      - name: Fresh checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Node 22.16
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: Run disposable Agent A with sandbox tampering
        id: agent
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/disposable-agent/agent-a.ts

      - name: Upload candidate worker result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: disposable-agent-worker-result
          path: worker-result.json
          if-no-files-found: error
          retention-days: 1

      - name: Supervisor confirms Agent A terminated
        if: always()
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: test "$AGENT_OUTCOME" = "failure"

  effect-broker:
    name: Trusted effect broker — validate, reserve, mutate, terminate
    needs: agent-a
    if: ${{ always() && needs.agent-a.outputs.outcome == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write
    outputs:
      outcome: ${{ steps.broker.outcome }}

    steps:
      - name: Fresh checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Node 22.16
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: Download trusted dispatch session
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: disposable-agent-task-session
          path: trusted-session

      - name: Download candidate worker result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: disposable-agent-worker-result
          path: candidate

      - name: Verify result, reserve exact effect, and mutate
        id: broker
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/disposable-agent/effect-broker.ts

      - name: Supervisor confirms broker terminated after effect
        if: always()
        env:
          BROKER_OUTCOME: ${{ steps.broker.outcome }}
        run: test "$BROKER_OUTCOME" = "failure"

  agent-b:
    name: Trusted recovery — fresh generation, canonical readback, settlement
    needs: effect-broker
    if: ${{ always() && needs.effect-broker.outputs.outcome == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: read
    env:
      EFFECT_BROKER_OUTCOME: ${{ needs.effect-broker.outputs.outcome }}

    steps:
      - name: Fresh checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Node 22.16
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: Reconstruct unresolved effect and settle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/disposable-agent/agent-b.ts
