name: GitHub settlement-equivalence live proof

on:
  push:
    branches:
      - correction/github-settlement-equivalence
    paths:
      - ".github/workflows/github-settlement-equivalence.yml"
      - "experiments/github-settlement-equivalence/**"
      - "src/**"
      - ".node-version"
  workflow_dispatch:

permissions: {}

jobs:
  prove:
    name: Physically distinct writes, identical settlement truth
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Run live provider proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node --experimental-strip-types experiments/github-settlement-equivalence/live-proof.ts
