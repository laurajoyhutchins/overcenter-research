name: Core-loop bounded concurrency

on:
  workflow_dispatch:
  pull_request:
    types: [ready_for_review]
    paths:
      - .github/workflows/core-loop-concurrency.yml
      - experiments/core-loop-concurrency/**
      - src/authority/engine.ts
      - src/authority/kernel.ts
      - src/execution/core-loop.ts
      - src/model.ts
      - package.json

permissions: {}

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  benchmark:
    name: Production bounded effect concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Exact source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Node from repository
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm run experiment:core-loop-concurrency
