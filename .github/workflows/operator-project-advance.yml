name: Overcenter command · project.advance

on:
  push:
    branches: [main]

permissions: {}

jobs:
  command:
    name: project.advance
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      actions: write
      contents: read
    env:
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_REF: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      COMMAND_IMPLEMENTATION_SHA: ${{ github.sha }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Advertise command
        if: ${{ github.run_attempt == 1 }}
        run: |
          {
            echo '## Overcenter command'
            echo
            echo '- command: `project.advance`'
            echo "- source SHA: `$SOURCE_SHA`"
            echo "- implementation SHA: `$COMMAND_IMPLEMENTATION_SHA`"
            echo '- state: available'
            echo
            echo 'Rerun this job to advance deterministically until judgment or intervention is required.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out trusted command implementation
        if: ${{ github.run_attempt > 1 }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.COMMAND_IMPLEMENTATION_SHA }}
          persist-credentials: false

      - name: Use pinned Node.js
        if: ${{ github.run_attempt > 1 }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: Invoke project.advance
        if: ${{ github.run_attempt > 1 }}
        id: invoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OVERCENTER_COMMAND_REPOSITORY_ID: ${{ github.repository_id }}
          OVERCENTER_COMMAND_REPOSITORY: ${{ github.repository }}
          OVERCENTER_COMMAND_SOURCE_SHA: ${{ env.SOURCE_SHA }}
          OVERCENTER_COMMAND_REF: ${{ env.SOURCE_REF }}
          OVERCENTER_COMMAND_DEFAULT_BRANCH: ${{ env.DEFAULT_BRANCH }}
          OVERCENTER_COMMAND_RUN_ID: ${{ github.run_id }}
          OVERCENTER_COMMAND_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node --experimental-strip-types bin/github-operator-command.ts project.advance

      - name: Publish command receipt
        if: ${{ github.run_attempt > 1 && always() }}
        env:
          DISPATCHED_RUN_ID: ${{ steps.invoke.outputs.dispatched_run_id }}
          DISPATCHED_HTML_URL: ${{ steps.invoke.outputs.dispatched_html_url }}
          RECEIPT_DIGEST: ${{ steps.invoke.outputs.receipt_digest }}
        run: |
          {
            echo '## Overcenter command receipt'
            echo
            echo '- command: `project.advance`'
            echo "- source SHA: `$SOURCE_SHA`"
            echo "- command attempt: `$RUN_ATTEMPT`"
            echo "- dispatched run ID: `${DISPATCHED_RUN_ID:-none}`"
            echo "- receipt digest: `${RECEIPT_DIGEST:-none}`"
            if [ -n "${DISPATCHED_HTML_URL:-}" ]; then
              echo "- dispatched run: $DISPATCHED_HTML_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
