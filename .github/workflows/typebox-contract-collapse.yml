name: TypeBox contract collapse experiment

on:
  pull_request:
    paths:
      - 'experiments/typebox-contract-collapse/**'
      - '.github/workflows/typebox-contract-collapse.yml'
      - 'src/model.ts'
      - 'src/observation.ts'
      - 'contracts/observation-evidence-v1/**'
      - 'scripts/generate-settlement-observation-schema.mjs'
      - 'test/linkml-production-contract.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.PROOF_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact experiment revision
        run: test "$(git rev-parse HEAD)" = "$PROOF_SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Install pinned experiment-only toolchain
        run: npm install --no-save --ignore-scripts --package-lock=false typebox@1.3.34 typescript@7.0.2
      - name: Prove runtime and JSON Schema equivalence
        run: node --experimental-strip-types --test experiments/typebox-contract-collapse/runtime.test.mjs
      - name: Prove static type equivalence and hostile rejection
        run: >-
          ./node_modules/.bin/tsc
          --noEmit
          --strict
          --target ES2024
          --module NodeNext
          --moduleResolution NodeNext
          --allowImportingTsExtensions
          --skipLibCheck
          experiments/typebox-contract-collapse/candidate.ts
          experiments/typebox-contract-collapse/static.test.ts
