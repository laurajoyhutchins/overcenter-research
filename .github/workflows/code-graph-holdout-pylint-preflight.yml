name: Pylint code graph holdout preflight

on:
  push:
    branches:
      - experiment/flask-code-graph-verification
    paths:
      - experiments/code-graph-holdout-pylint/**
      - experiments/code-graph-verification/frontier.py
      - experiments/code-graph-verification/score.py
      - .github/workflows/code-graph-holdout-pylint-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pylint-code-graph-holdout-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Verify frozen holdout contract
        run: node --test experiments/code-graph-holdout-pylint/contract.test.mjs
      - name: Fetch Pylint history
        run: git clone --filter=blob:none https://github.com/pylint-dev/pylint.git /tmp/pylint
      - name: Require exact holdout admission
        run: |
          python3 experiments/code-graph-holdout-pylint/preflight.py \
            --pylint-repo /tmp/pylint \
            --out "$RUNNER_TEMP/pylint-holdout-preflight.json" \
            --require-admission
      - name: Publish summary
        if: always()
        env:
          PREFLIGHT: ${{ runner.temp }}/pylint-holdout-preflight.json
        run: |
          python3 - <<'PY'
          import json, os
          path=os.environ["PREFLIGHT"]
          if not os.path.exists(path):
              raise SystemExit(0)
          report=json.load(open(path))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## Pylint holdout preflight\n\n")
              out.write(f"- representation frozen: **{report['representation']['frozen']}**\n")
              out.write(f"- execution admission: **{report['execution_admission']}**\n")
              for key,value in report["counts"].items():
                  out.write(f"- {key}: {value}\n")
              out.write("\n### Test discovery\n\n")
              for case in report["cases"]:
                  discovery=case.get("test_discovery") or {}
                  out.write(
                      f"- `{case['id']}`: "
                      f"{discovery.get('tests',0)} tests\n"
                  )
          PY
