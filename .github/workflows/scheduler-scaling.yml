name: Scheduler fairness and scaling

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/scheduler-scaling
  pull_request:
    paths:
      - .github/workflows/scheduler-scaling.yml
      - experiments/scheduler-scaling/**
      - src/kernel.ts
      - src/kernel-core.ts
      - src/sqlite-store.ts
      - src/projector.ts
      - src/projection.ts
      - src/fact-store.ts
      - package.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Fairness witness and N-way scaling
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm run experiment:scheduler-scaling
