name: Release evidence substitution experiment

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/release-evidence-substitution
    paths:
      - 'experiments/release-evidence-substitution/**'
      - 'experiments/registry.json'
      - 'package.json'
      - 'src/digest.ts'
      - 'src/realization.ts'
      - 'src/providers/kubernetes-deployment.ts'
      - 'test/kubernetes-deployment-verifier.test.ts'
      - 'experiments/production-criticality-ranking/mutation-probes.json'
      - 'experiments/production-criticality-ranking/stryker.config.mjs'
      - '.github/workflows/release-evidence-substitution.yml'
  pull_request:
    paths:
      - 'experiments/release-evidence-substitution/**'
      - 'experiments/registry.json'
      - 'package.json'
      - 'src/digest.ts'
      - 'src/realization.ts'
      - 'src/providers/kubernetes-deployment.ts'
      - 'test/kubernetes-deployment-verifier.test.ts'
      - 'experiments/production-criticality-ranking/mutation-probes.json'
      - 'experiments/production-criticality-ranking/stryker.config.mjs'
      - '.github/workflows/release-evidence-substitution.yml'

permissions:
  contents: read

jobs:
  deterministic-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - run: npm run test:experiment-contract
      - run: npm run test:release-evidence-substitution
      - run: npm run test:kubernetes-deployment
      - run: npm run test:realization-reuse
      - run: npm run measure:release-evidence-substitution

  hosted-temporal-kind:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Install pinned Temporal TypeScript SDK
        run: |
          npm install --no-save \
            @temporalio/client@1.24.0 \
            @temporalio/worker@1.24.0 \
            @temporalio/workflow@1.24.0 \
            @temporalio/activity@1.24.0

      - name: Install pinned Temporal CLI
        run: |
          curl --fail --silent --show-error --location \
            https://temporal.download/cli.sh \
            --output "$RUNNER_TEMP/install-temporal.sh"
          sh "$RUNNER_TEMP/install-temporal.sh" \
            --version 1.7.3 \
            --dir "$RUNNER_TEMP/temporal"
          sudo install "$RUNNER_TEMP/temporal/bin/temporal" /usr/local/bin/temporal
          temporal --version

      - name: Install pinned kind and kubectl
        run: |
          curl --fail --location --retry 3 \
            https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64 \
            --output "$RUNNER_TEMP/kind"
          chmod +x "$RUNNER_TEMP/kind"
          sudo mv "$RUNNER_TEMP/kind" /usr/local/bin/kind

          curl --fail --location --retry 3 \
            https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl \
            --output "$RUNNER_TEMP/kubectl"
          chmod +x "$RUNNER_TEMP/kubectl"
          sudo mv "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl

      - name: Create pinned Kubernetes cluster
        run: |
          kind create cluster \
            --name release-proof \
            --image kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f \
            --wait 120s
          kubectl version

      - name: Run live Temporal and Kubernetes fault schedule
        run: |
          set -euo pipefail
          temporal server start-dev --ip 127.0.0.1 --port 7233 \
            >"$RUNNER_TEMP/temporal.log" 2>&1 &
          temporal_pid=$!
          trap 'kill "$temporal_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in {1..60}; do
            if temporal operator namespace list >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "$RUNNER_TEMP/temporal.log"
            exit 1
          fi

          node --experimental-strip-types \
            experiments/release-evidence-substitution/run-hosted.mjs


  focused-mutation:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MUTATION_PROBE: kubernetes-deployment-realization
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - id: mutation-tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: mutation-tools-${{ runner.os }}-${{ hashFiles('.node-version', 'package.json') }}-stryker-10.0.0-typescript-5.8.3
      - name: Install pinned mutation engine
        if: steps.mutation-tools.outputs.cache-hit != 'true'
        run: npm install --no-save --ignore-scripts @stryker-mutator/core@10.0.0 typescript@5.8.3
      - name: Run focused production-verifier mutation probe
        run: ./node_modules/.bin/stryker run experiments/production-criticality-ranking/stryker.config.mjs
      - name: Require every selected mutant to be killed
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {summarize} from './experiments/production-criticality-ranking/summarize-mutation.mjs';
          const report=JSON.parse(fs.readFileSync('mutation.json','utf8'));
          const ranges=JSON.parse(fs.readFileSync('mutation-ranges.json','utf8'));
          const rows=summarize(report,ranges);
          if(rows.length!==1 || rows[0].id!=='kubernetes-deployment-realization'){
            throw new Error('unexpected focused mutation selection');
          }
          const row=rows[0];
          console.log(JSON.stringify(row,null,2));
          if(row.total===0) throw new Error('mutation probe produced no mutants');
          if(row.survived+row.noCoverage+row.timeout+row.runtimeError!==0){
            throw new Error('Deployment realization mutation probe has surviving, uncovered, or errored mutants');
          }
          NODE
