name: Production computation executor

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-computation-executor-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  executor:
    name: Exact-byte computation boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: '.go-version'
          cache: false
      - name: Production slice proof
        run: npm run proof:production
