name: Production computation executor

on:
  workflow_dispatch:
  push:
    branches:
      - implementation/go-computation-executor
    paths:
      - .github/workflows/computation-executor.yml
      - contracts/computation-execution-v1/**
      - executor/**
      - src/computation-execution.ts
      - src/go-executor-client.ts
      - test/computation-executor.test.ts
      - test/fixtures/computation-child.mjs
      - package.json
  pull_request:
    paths:
      - .github/workflows/computation-executor.yml
      - contracts/computation-execution-v1/**
      - executor/**
      - src/computation-execution.ts
      - src/go-executor-client.ts
      - test/computation-executor.test.ts
      - test/fixtures/computation-child.mjs
      - package.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  executor:
    name: Exact-byte computation boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: executor/go.mod
          cache: false
      - name: Go protocol and runtime unit tests
        working-directory: executor
        run: go test ./...
      - name: Cross-language production boundary
        run: npm run test:computation-executor
      - name: Repository regression
        run: npm test
