name: Production computation executor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/computation-executor.yml
      - .go-version
      - .node-version
      - contracts/computation-execution-v1/**
      - executor/**
      - src/computation-execution.ts
      - src/computation-runner.ts
      - src/fact-store.ts
      - src/kernel-core.ts
      - src/kernel.ts
      - src/sqlite-store.ts
      - src/go-executor-client.ts
      - src/production-containment.ts
      - src/observation.ts
      - test/computation-executor.test.ts
      - test/computation-container.test.ts
      - test/config-contract.test.ts
      - test/fixtures/computation-child.mjs
      - package.json
      - scripts/proof-production.sh
      - bin/prove-computation-containment.ts
  pull_request:
    paths:
      - .github/workflows/computation-executor.yml
      - .go-version
      - .node-version
      - contracts/computation-execution-v1/**
      - executor/**
      - src/computation-execution.ts
      - src/computation-runner.ts
      - src/fact-store.ts
      - src/kernel-core.ts
      - src/kernel.ts
      - src/sqlite-store.ts
      - src/go-executor-client.ts
      - src/production-containment.ts
      - test/computation-executor.test.ts
      - test/computation-container.test.ts
      - test/config-contract.test.ts
      - test/fixtures/computation-child.mjs
      - package.json

permissions:
  contents: read

concurrency:
  group: production-computation-executor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  executor:
    name: Exact-byte computation boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: '.go-version'
          cache: false
      - name: Production slice proof
        run: npm run proof:production
