name: Effect authority decay

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/effect-authority-decay.yml
      - experiments/effect-authority-decay/**
      - package.json
      - src/authority/engine.ts
      - src/providers/github/status-effect.ts
      - src/providers/github/pr-update-branch-effect.ts
      - test/effect-authority-types.ts
      - test/github-status-effect.test.ts
      - test/github-pr-update-branch-effect.test.ts
      - test/git-kernel.test.ts

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  experiment:
    name: Bound effect authority differential
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Exact source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Node from repository
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: Install pinned development dependencies
        run: npm install --ignore-scripts --package-lock=false


      - name: Type, security, and authority-decay criteria
        run: npm run test:effect-authority-decay

      - name: Existing provider effect regression
        run: node --experimental-strip-types --test test/github-status-effect.test.ts test/github-pr-update-branch-effect.test.ts

      - name: Same-runner production latency differential
        run: npm run bench:effect-authority-decay
