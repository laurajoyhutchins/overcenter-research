name: Evidence reference publication

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/evidence-reference-publication.yml
      - experiments/evidence-reference-publication/**
      - experiments/registry.json
      - experiments/README.md
      - package.json
      - src/evidence/**
      - src/storage/sqlite.ts

permissions: {}

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  publication:
    name: Evidence-first authority publication
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Exact source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Node from repository
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Install pinned TypeScript toolchain
        run: npm install --ignore-scripts --package-lock=false
      - name: Type-check repository
        run: npm run typecheck
      - name: Experiment contract
        run: npm run test:experiment-contract
      - name: Evidence reference publication
        run: npm run test:evidence-reference-publication
