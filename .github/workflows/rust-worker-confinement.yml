name: Rust worker confinement

on:
  push:
    branches:
      - implementation/rust-worker-confinement
    paths:
      - 'runtime/overcenter-exec/**'
      - 'src/execution-manifest.ts'
      - 'src/confined-executor.ts'
      - 'test/execution-manifest.test.ts'
      - 'package.json'
      - '.node-version'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust-worker-confinement.yml'
  pull_request:
    paths:
      - 'runtime/overcenter-exec/**'
      - 'src/execution-manifest.ts'
      - 'src/confined-executor.ts'
      - 'test/execution-manifest.test.ts'
      - 'package.json'
      - '.node-version'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust-worker-confinement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --no-self-update
          test "$(rustc --version | awk '{print $2}')" = "$channel"
      - name: TypeScript manifest and transport contract
        run: node --experimental-strip-types --test test/execution-manifest.test.ts
      - name: Production Rust confinement proof
        run: bash runtime/overcenter-exec/proof.sh
