name: Overcenter request signal

on:
  create:

permissions: {}

jobs:
  signal:
    name: Unprivileged request signal
    if: >-
      github.event.ref_type == 'branch' &&
      startsWith(github.event.ref, 'overcenter/request/')
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Emit no authority
        run: 'true'
