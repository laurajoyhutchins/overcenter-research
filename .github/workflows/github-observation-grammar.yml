name: GitHub observation grammar proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/github-observation-grammar.yml
      - experiments/github-observation-grammar/inventory.ts
      - experiments/github-observation-grammar/live-ref-proof.ts
      - experiments/github-observation-grammar/openapi.ts
      - experiments/github-observation-grammar/semantics.ts
      - experiments/github-observation-grammar/github-observation.test.ts
      - research/github-observation-grammar.md
      - package.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full regression and observation proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - run: npm test

  inventory:
    name: Pinned schema and live ref proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Fetch immutable 2026-03-10 dereferenced schema
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/github/rest-api-description/d4278c869e367f5d6d4e0f46878119128abba77b/descriptions/api.github.com/dereferenced/api.github.com.2026-03-10.deref.json \
            --output "$RUNNER_TEMP/github-openapi.json"
      - name: Generate read-only observation inventory
        run: |
          node --experimental-strip-types experiments/github-observation-grammar/inventory.ts \
            "$RUNNER_TEMP/github-openapi.json" \
            2026-03-10
      - name: Prove live ref readback through generated descriptor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types experiments/github-observation-grammar/live-ref-proof.ts \
            "$RUNNER_TEMP/github-openapi.json"
