name: GitHub observation grammar proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - experiment/github-observation-grammar
      - experiment/github-observation-semantics
      - experiment/provider-certificate-reuse
      - experiment/github-authority-command
    paths:
      - .github/workflows/github-observation-grammar.yml
      - experiments/github-observation-grammar/**
      - experiments/provider-observation/**
      - src/model.ts
      - src/observation.ts
      - src/semantics.ts
      - src/github-authority-command.ts
      - src/provider-observation/**
      - src/providers/**
      - scripts/generate-github-operations.ts
      - bin/github-authority.ts
      - test/provider-observation.test.ts
      - test/github-certified-status.test.ts
      - test/github-certified-ref.test.ts
      - test/github-certified-pr.test.ts
      - test/github-openapi-contract.test.ts
      - test/github-authority-command.test.ts
      - research/github-observation-grammar.md
      - research/provider-observation-reuse.md
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/github-observation-grammar.yml
      - experiments/github-observation-grammar/**
      - experiments/provider-observation/**
      - src/model.ts
      - src/observation.ts
      - src/semantics.ts
      - src/github-authority-command.ts
      - src/provider-observation/**
      - src/providers/**
      - scripts/generate-github-operations.ts
      - bin/github-authority.ts
      - test/provider-observation.test.ts
      - test/github-certified-status.test.ts
      - test/github-certified-ref.test.ts
      - test/github-certified-pr.test.ts
      - test/github-openapi-contract.test.ts
      - test/github-authority-command.test.ts
      - research/github-observation-grammar.md
      - research/provider-observation-reuse.md

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read
  issues: read
  pull-requests: read
  statuses: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit regression and observation experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Focused GitHub observation regressions
        run: |
          node --experimental-strip-types --test \
            test/provider-observation.test.ts \
            test/github-openapi-contract.test.ts \
            test/github-certified-status.test.ts \
            test/github-certified-ref.test.ts \
            test/github-certified-pr.test.ts \
            test/github-authority-command.test.ts
      - name: Shared observation certificate adversaries
        run: node --experimental-strip-types --test experiments/provider-observation/response-slice.test.ts
      - name: GitHub observation experiment
        run: node --experimental-strip-types --test experiments/github-observation-grammar/github-observation.test.ts

  semantics:
    name: Pinned schema and live semantic shapes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Fetch immutable 2026-03-10 dereferenced schema
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/github/rest-api-description/d4278c869e367f5d6d4e0f46878119128abba77b/descriptions/api.github.com/dereferenced/api.github.com.2026-03-10.deref.json \
            --output "$RUNNER_TEMP/github-openapi.json"
      - name: Regenerate GitHub operation contracts
        run: |
          node --experimental-strip-types scripts/generate-github-operations.ts \
            "$RUNNER_TEMP/github-openapi.json"
          git diff --exit-code -- src/providers/github-operations.generated.ts
      - name: Verify runtime GitHub contracts against pinned OpenAPI
        run: |
          node --experimental-strip-types experiments/github-observation-grammar/verify-kernel-github-contract.ts \
            "$RUNNER_TEMP/github-openapi.json"
      - name: Generate complete read-only observation inventory
        run: |
          node --experimental-strip-types experiments/github-observation-grammar/inventory.ts \
            "$RUNNER_TEMP/github-openapi.json" \
            2026-03-10
      - name: Verify representative semantic shapes exist in the pinned contract
        run: |
          node --experimental-strip-types experiments/github-observation-grammar/semantic-inventory.ts \
            "$RUNNER_TEMP/github-openapi.json"
      - name: Inventory representative response schema complexity
        run: |
          node --experimental-strip-types experiments/github-observation-grammar/response-schema-inventory.ts \
            "$RUNNER_TEMP/github-openapi.json"
      - name: Prove live identity, immutable, mutable, pagination, conditional, and reconstruction semantics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_REF: main
          STATUS_REF: b91ac6c4e64f72b83c6a8d8caa78e9482037a2d1
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          VOLATILE_CHECK_REF: ${{ github.sha }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --experimental-strip-types experiments/github-observation-grammar/live-semantic-proof.ts \
            "$RUNNER_TEMP/github-openapi.json"

      - name: Prove runtime commit-status readback uses certified observations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/github-observation-grammar/live-kernel-status-readback.ts

      - name: Prove runtime ref authority fence uses certified observations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --experimental-strip-types experiments/github-observation-grammar/live-kernel-ref-fence.ts

      - name: Prove runtime PR work identity uses certified observations
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          PR_STATE: ${{ github.event.pull_request.state }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node --experimental-strip-types experiments/github-observation-grammar/live-kernel-pr-identity.ts

      - name: Exercise semantic GitHub ref authority command
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm run github:authority -- ref \
            --repository-id 1354872053 \
            --repository laurajoyhutchins/overcenter-research \
            --ref "heads/$SOURCE_REF" \
            --expected-sha "$SOURCE_SHA"

          set +e
          npm run github:authority -- ref \
            --repository-id 1354872053 \
            --repository laurajoyhutchins/overcenter-research \
            --ref "heads/$SOURCE_REF" \
            --expected-sha 0000000000000000000000000000000000000000
          stale_code=$?
          set -e
          test "$stale_code" -eq 2

      - name: Exercise semantic GitHub PR authority command
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run github:authority -- pr \
            --repository-id 1354872053 \
            --repository laurajoyhutchins/overcenter-research \
            --pull-number "${{ github.event.pull_request.number }}" \
            --node-id "${{ github.event.pull_request.node_id }}" \
            --state "${{ github.event.pull_request.state }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --base-ref "${{ github.event.pull_request.base.ref }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}"
