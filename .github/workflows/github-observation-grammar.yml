name: GitHub observation grammar proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - experiment/github-observation-grammar
      - experiment/github-observation-semantics
      - experiment/provider-certificate-reuse
    paths:
      - .github/workflows/github-observation-grammar.yml
      - experiments/github-observation-grammar/**
      - experiments/provider-observation/**
      - research/github-observation-grammar.md
      - research/provider-observation-reuse.md
      - package.json
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/github-observation-grammar.yml
      - experiments/github-observation-grammar/**
      - experiments/provider-observation/**
      - research/github-observation-grammar.md
      - research/provider-observation-reuse.md
      - package.json

permissions:
  actions: read
  contents: read
  checks: read
  pull-requests: read
  statuses: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit regression and observation experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Fast deterministic regression
        run: npm test
      - name: Shared observation certificate adversaries
        run: npm run test:provider-observation
      - name: GitHub observation experiment
        run: npm run test:github-observation

  semantics:
    name: Pinned schema and live semantic shapes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Fetch immutable 2026-03-10 dereferenced schema
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/github/rest-api-description/d4278c869e367f5d6d4e0f46878119128abba77b/descriptions/api.github.com/dereferenced/api.github.com.2026-03-10.deref.json \
            --output "$RUNNER_TEMP/github-openapi.json"
      - name: Generate complete read-only observation inventory
        run: |
          node --experimental-strip-types experiments/github-observation-grammar/inventory.ts \
            "$RUNNER_TEMP/github-openapi.json" \
            2026-03-10
      - name: Verify representative semantic shapes exist in the pinned contract
        run: |
          node --experimental-strip-types experiments/github-observation-grammar/semantic-inventory.ts \
            "$RUNNER_TEMP/github-openapi.json"
      - name: Inventory representative response schema complexity
        run: |
          node --experimental-strip-types experiments/github-observation-grammar/response-schema-inventory.ts \
            "$RUNNER_TEMP/github-openapi.json"
      - name: Prove live identity, immutable, mutable, pagination, conditional, and reconstruction semantics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_REF: main
          STATUS_REF: b91ac6c4e64f72b83c6a8d8caa78e9482037a2d1
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          VOLATILE_CHECK_REF: ${{ github.sha }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --experimental-strip-types experiments/github-observation-grammar/live-semantic-proof.ts \
            "$RUNNER_TEMP/github-openapi.json"
