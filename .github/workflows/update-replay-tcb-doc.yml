name: Update replay TCB doc

on:
  push:
    branches:
      - fix/system-evidence-authority-replay
    paths:
      - '.github/workflows/update-replay-tcb-doc.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/system-evidence-authority-replay
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Update generated TCB baseline
        run: |
          set -euo pipefail
          npm run update:tcb-doc
          rm .github/workflows/update-replay-tcb-doc.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Synchronize replay-safe TCB projection"
          git push origin HEAD:fix/system-evidence-authority-replay
