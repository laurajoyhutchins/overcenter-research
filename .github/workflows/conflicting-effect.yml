name: Overcenter conflicting-effect ordering proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/conflicting-effect.yml
      - experiments/conflicting-effect/agent.ts
      - experiments/conflicting-effect/recovery.ts
      - experiments/conflicting-effect/guard-authority.ts
      - experiments/conflicting-effect/guard-claim-beta.ts
      - experiments/conflicting-effect/guard-verify.ts
      - src/**
      - experiments/conflicting-effect/effect-ordering.test.ts
      - package.json

permissions: {}


jobs:
  authority:
    name: Reject unordered conflict at admission, claim ordered predecessor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Full regression suite
        run: npm test
      - name: Prove unordered beta is rejected and claim ordered alpha
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/conflicting-effect/guard-authority.ts

  alpha:
    name: Ordered alpha writes success
    needs: authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    outputs:
      outcome: ${{ steps.agent.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - id: agent
        name: Alpha effect then terminate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLOT: alpha
          WRITE_CONTEXT_CASE: upper
        run: node --experimental-strip-types experiments/conflicting-effect/agent.ts

  recover-alpha:
    name: Settle ordered alpha
    needs: alpha
    if: ${{ always() && needs.alpha.outputs.outcome == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: read
    env:
      SLOT: alpha
      AGENT_OUTCOME: ${{ needs.alpha.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/conflicting-effect/recovery.ts

  claim-beta:
    name: Claim ordered beta after alpha
    needs: recover-alpha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - run: node --experimental-strip-types experiments/conflicting-effect/guard-claim-beta.ts

  beta:
    name: Ordered beta writes failure
    needs: claim-beta
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    outputs:
      outcome: ${{ steps.agent.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - id: agent
        name: Beta effect then terminate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLOT: beta
        run: node --experimental-strip-types experiments/conflicting-effect/agent.ts

  recover-beta:
    name: Settle ordered beta
    needs: beta
    if: ${{ always() && needs.beta.outputs.outcome == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: read
    env:
      SLOT: beta
      AGENT_OUTCOME: ${{ needs.beta.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/conflicting-effect/recovery.ts

  verify:
    name: Verify conflict guard and explicit ordering
    needs: recover-beta
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/conflicting-effect/guard-verify.ts
