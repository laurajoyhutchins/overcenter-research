name: Overcenter conflicting-effect counterexample

on:
  push:
    branches:
      - prototype/conflicting-effect-boundary
    paths:
      - .github/workflows/conflicting-effect.yml
      - actions/conflict-authority.ts
      - actions/conflict-agent.ts
      - actions/conflict-recovery.ts
      - actions/conflict-verify.ts
      - src/git-kernel.ts

permissions: {}

jobs:
  authority:
    name: Define and claim unordered conflict
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - name: Define and claim conflicting work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types actions/conflict-authority.ts

  alpha:
    name: Alpha writes success
    needs: authority
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    outputs:
      outcome: ${{ steps.agent.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - name: Alpha effect then terminate
        id: agent
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLOT: alpha
        run: node --experimental-strip-types actions/conflict-agent.ts

  recover-alpha:
    name: Settle alpha DONE
    needs: alpha
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: read
    env:
      SLOT: alpha
      AGENT_OUTCOME: ${{ needs.alpha.outputs.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - name: Recover and settle alpha
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types actions/conflict-recovery.ts

  beta:
    name: Beta later writes failure
    needs: recover-alpha
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    outputs:
      outcome: ${{ steps.agent.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - name: Beta effect then terminate
        id: agent
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLOT: beta
        run: node --experimental-strip-types actions/conflict-agent.ts

  recover-beta:
    name: Settle beta DONE
    needs: beta
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: read
    env:
      SLOT: beta
      AGENT_OUTCOME: ${{ needs.beta.outputs.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - name: Recover and settle beta
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types actions/conflict-recovery.ts

  verify:
    name: Prove both DONE but provider now failure
    needs: recover-beta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - name: Verify counterexample
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types actions/conflict-verify.ts
