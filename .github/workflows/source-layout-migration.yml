name: One-shot source layout migration

on:
  push:
    branches:
      - refactor/source-layout

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: Rewrite source-layout references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import os
          import posixpath
          import re
          import subprocess

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          base = git("merge-base", "HEAD", "origin/main")
          diff = subprocess.check_output(
              ["git", "diff", "--name-status", "-M", base, "HEAD", "--", "src"],
              text=True,
          )

          moves: dict[str, str] = {}
          for line in diff.splitlines():
              parts = line.split("\t")
              if parts and parts[0].startswith("R") and len(parts) == 3:
                  moves[parts[1]] = parts[2]

          if len(moves) < 50:
              raise SystemExit(f"expected at least 50 source moves, found {len(moves)}")

          inverse = {new: old for old, new in moves.items()}
          old_paths = set(
              subprocess.check_output(
                  ["git", "ls-tree", "-r", "--name-only", base],
                  text=True,
              ).splitlines()
          )

          text_suffixes = {
              ".ts", ".mts", ".cts", ".js", ".mjs", ".cjs",
              ".json", ".md", ".yml", ".yaml", ".toml", ".tla",
          }
          code_suffixes = {".ts", ".mts", ".cts", ".js", ".mjs", ".cjs"}

          def ext(path: str) -> str:
              return PurePosixPath(path).suffix

          def replace_ext(path: str, suffix: str) -> str:
              p = PurePosixPath(path)
              return str(p.with_suffix(suffix))

          def old_target(old_file: str, spec: str):
              if not spec.startswith("."):
                  return None
              raw = posixpath.normpath(posixpath.join(posixpath.dirname(old_file), spec))
              candidates = [raw]
              suffix = ext(raw)
              if suffix == ".js":
                  candidates.append(replace_ext(raw, ".ts"))
              if suffix == ".mjs":
                  candidates.append(replace_ext(raw, ".mts"))
              if not suffix:
                  candidates.extend([
                      raw + ".ts",
                      raw + ".mjs",
                      raw + ".js",
                      raw + "/index.ts",
                      raw + "/index.js",
                  ])
              for candidate in candidates:
                  if candidate in old_paths or candidate in moves:
                      return candidate
              return None

          def rewrite_spec(old_file: str, new_file: str, spec: str) -> str:
              target = old_target(old_file, spec)
              if target is None:
                  return spec
              new_target = moves.get(target, target)
              if old_file == new_file and new_target == target:
                  return spec

              rel = posixpath.relpath(new_target, posixpath.dirname(new_file) or ".")
              if not rel.startswith("."):
                  rel = "./" + rel

              original_suffix = ext(spec)
              target_suffix = ext(target)
              if original_suffix == ".js" and target_suffix == ".ts":
                  rel = replace_ext(rel, ".js")
              elif original_suffix == ".mjs" and target_suffix == ".mts":
                  rel = replace_ext(rel, ".mjs")
              elif not original_suffix and target_suffix:
                  rel = rel[: -len(target_suffix)]
              return rel

          patterns = [
              re.compile(r"(\bfrom\s*)(['\"])([^'\"\n]+)\2"),
              re.compile(r"(\bimport\s*)(['\"])([^'\"\n]+)\2"),
              re.compile(r"(\bimport\s*\(\s*)(['\"])([^'\"\n]+)\2"),
              re.compile(r"(\brequire\s*\(\s*)(['\"])([^'\"\n]+)\2"),
          ]

          changed = []
          ordered_moves = sorted(moves.items(), key=lambda item: len(item[0]), reverse=True)

          for file in sorted(Path(".").rglob("*")):
              if not file.is_file() or file.suffix not in text_suffixes or ".git" in file.parts:
                  continue
              path = file.as_posix()
              try:
                  content = file.read_text()
              except UnicodeDecodeError:
                  continue
              original = content
              old_file = inverse.get(path, path)

              if file.suffix in code_suffixes:
                  for pattern in patterns:
                      content = pattern.sub(
                          lambda match: (
                              match.group(1)
                              + match.group(2)
                              + rewrite_spec(old_file, path, match.group(3))
                              + match.group(2)
                          ),
                          content,
                      )

              for old, new in ordered_moves:
                  content = content.replace(old, new)

              if content != original:
                  file.write_text(content)
                  changed.append(path)

          package = Path("package.json")
          package_text = package.read_text()
          if "test/source-layout.test.ts" not in package_text:
              anchor = "test/project-agent-actions.test.ts"
              if anchor not in package_text:
                  raise SystemExit("could not locate test:unit anchor")
              package_text = package_text.replace(
                  anchor,
                  anchor + " test/source-layout.test.ts",
                  1,
              )
              package.write_text(package_text)
              changed.append("package.json")

          expected_root = sorted([
              "README.md",
              "authority",
              "digest.ts",
              "execution",
              "generated",
              "graph",
              "model.ts",
              "observation",
              "providers",
              "semantics.ts",
              "storage",
              "structural-schema.ts",
              "validation.ts",
          ])
          actual_root = sorted(path.name for path in Path("src").iterdir())
          if actual_root != expected_root:
              raise SystemExit(f"unexpected src root: {actual_root}")

          provider_dirs = sorted(
              path.name for path in Path("src/providers").iterdir() if path.is_dir()
          )
          if provider_dirs != ["gcp", "github", "kubernetes"]:
              raise SystemExit(f"unexpected provider namespaces: {provider_dirs}")

          stale = []
          for file in sorted(Path(".").rglob("*")):
              if not file.is_file() or file.suffix not in text_suffixes or ".git" in file.parts:
                  continue
              try:
                  content = file.read_text()
              except UnicodeDecodeError:
                  continue
              for old in moves:
                  if old in content:
                      stale.append(f"{file.as_posix()}:{old}")
                      if len(stale) >= 20:
                          break
              if len(stale) >= 20:
                  break
          if stale:
              raise SystemExit("stale source paths remain:\n" + "\n".join(stale))

          print(f"rewrote {len(set(changed))} files")
          PY

      - name: Remove one-shot migration workflow from candidate tree
        run: git rm .github/workflows/source-layout-migration.yml

      - name: Verify source layout
        run: |
          node --experimental-strip-types --test test/source-layout.test.ts
          npm test

      - name: Commit repaired layout
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair source-layout references"
          git push origin HEAD:refactor/source-layout
