name: Requests code graph holdout preflight

on:
  push:
    branches:
      - experiment/flask-code-graph-verification
    paths:
      - experiments/code-graph-holdout-requests/**
      - experiments/code-graph-verification/frontier.py
      - experiments/code-graph-verification/score.py
      - .github/workflows/code-graph-holdout-requests-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: requests-code-graph-holdout-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Verify frozen holdout contract
        run: node --test experiments/code-graph-holdout-requests/contract.test.mjs
      - name: Fetch Requests history
        run: git clone --filter=blob:none https://github.com/psf/requests.git /tmp/requests
      - name: Require exact holdout admission
        run: |
          python3 experiments/code-graph-holdout-requests/preflight.py \
            --requests-repo /tmp/requests \
            --out "$RUNNER_TEMP/requests-holdout-preflight.json" \
            --require-admission
      - name: Publish summary
        if: always()
        env:
          PREFLIGHT: ${{ runner.temp }}/requests-holdout-preflight.json
        run: |
          python3 - <<'PY'
          import json, os
          p=os.environ["PREFLIGHT"]
          if not os.path.exists(p):
              raise SystemExit(0)
          r=json.load(open(p))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## Requests holdout preflight\n\n")
              out.write(f"- representation frozen: **{r['representation']['frozen']}**\n")
              out.write(f"- execution admission: **{r['execution_admission']}**\n")
              for k,v in r["counts"].items():
                  out.write(f"- {k}: {v}\n")
          PY
