name: Merge gate
run-name: candidate.certify=${{ inputs.source_sha || github.sha }} base=${{ inputs.base_sha || 'none' }} event=${{ github.event_name }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA expected at the selected ref
        required: true
        type: string
      base_sha:
        description: Exact base SHA whose candidate relation is being certified
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Evidence
    uses: ./.github/workflows/tests.yml
    with:
      expensive: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      source_sha: ${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}
      base_sha: ${{ github.event.pull_request.base.sha || inputs.base_sha || '' }}
      emit_tree_evidence: ${{ github.event_name == 'workflow_dispatch' }}

  gate:
    name: ${{ github.event_name == 'pull_request' && 'PR preflight' || 'Merge gate' }}
    if: ${{ always() }}
    needs: evidence
    runs-on: ubuntu-slim
    timeout-minutes: 1
    env:
      EVENT_NAME: ${{ github.event_name }}
      EVENT_ACTION: ${{ github.event.action || '' }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha || '' }}
      REQUESTED_BASE_SHA: ${{ inputs.base_sha || '' }}
      EVIDENCE_RESULT: ${{ needs.evidence.result }}
    steps:
      - name: Require an exact-head candidate before merge
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              echo "PR preflight only; invoke candidate.certify to publish Overcenter's exact-head Merge gate."
              ;;
            workflow_dispatch)
              test -n "$REQUESTED_SOURCE_SHA"
              test -n "$REQUESTED_BASE_SHA"
              test "$REQUESTED_SOURCE_SHA" = "$SOURCE_SHA"
              ;;
            push)
              ;;
            *)
              echo "::error::Unsupported merge-gate event: $EVENT_NAME"
              exit 1
              ;;
          esac

      - name: Require evidence for this execution mode
        run: |
          set -euo pipefail
          printf 'source_sha=%s\n' "$SOURCE_SHA"
          printf 'evidence=%s\n' "$EVIDENCE_RESULT"
          test "$EVIDENCE_RESULT" = success

      - name: Publish merge-gate evidence summary
        if: ${{ always() }}
        run: |
          {
            if [ "$EVENT_NAME" = pull_request ]; then
              echo '## PR preflight'
              echo
              echo '- merge certification: not requested'
              echo '- next action: invoke `candidate.certify` for this exact head'
            else
              echo '## Merge gate'
              echo
              echo '- merge certification: exact-head candidate'
            fi
            echo "- source SHA: $SOURCE_SHA"
            echo "- event: $EVENT_NAME"
            echo "- action: ${EVENT_ACTION:-none}"
            echo "- requested source SHA: ${REQUESTED_SOURCE_SHA:-not supplied}"
            echo "- requested base SHA: ${REQUESTED_BASE_SHA:-not supplied}"
            echo "- Evidence: $EVIDENCE_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
