name: Overcenter project advance

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact trusted default-branch revision
        required: true
        type: string

permissions: {}

jobs:
  advance:
    name: Advance project
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
      statuses: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Require exact trusted source
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$SOURCE_SHA"

      - name: Check out exact trusted implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: Advance through deterministic work
        id: advance
        run: |
          set -euo pipefail
          node --experimental-strip-types bin/github-project-advance.ts \
            --output "$RUNNER_TEMP/project-advance.json"

      - name: Upload exact result packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: overcenter-project-advance-${{ github.run_id }}
          path: ${{ runner.temp }}/project-advance.json
          if-no-files-found: error
          retention-days: 1

      - name: Publish advancement summary
        env:
          OUTCOME: ${{ steps.advance.outputs.outcome }}
          AUTHORITY_REVISION: ${{ steps.advance.outputs.authority_revision }}
          OBLIGATION_ID: ${{ steps.advance.outputs.obligation_id }}
          RUN_ID: ${{ steps.advance.outputs.run_id }}
        run: |
          {
            echo '## Overcenter project.advance'
            echo
            echo "- outcome: `$OUTCOME`"
            echo "- authority revision: `$AUTHORITY_REVISION`"
            if [ -n "$OBLIGATION_ID" ]; then echo "- obligation: `$OBLIGATION_ID`"; fi
            if [ -n "$RUN_ID" ]; then echo "- run: `$RUN_ID`"; fi
          } >> "$GITHUB_STEP_SUMMARY"
