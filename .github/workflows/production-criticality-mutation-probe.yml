name: Criticality mutation probe

on:
  pull_request:
    paths:
      - 'src/digest.ts'
      - 'src/semantic-identity.ts'
      - 'src/projector.ts'
      - 'src/kernel-core.ts'
      - 'src/observation.ts'
      - 'experiments/production-criticality-ranking/mutation-probes.json'
      - 'experiments/production-criticality-ranking/resolve-mutation-probes.mjs'
      - 'experiments/production-criticality-ranking/stryker.config.mjs'
      - 'experiments/production-criticality-ranking/summarize-mutation.mjs'
      - 'experiments/production-criticality-ranking/summarize-mutation.test.mjs'
      - 'experiments/production-criticality-ranking/emit-mutation-evidence.mjs'
      - 'experiments/production-criticality-ranking/verify-mutation-evidence.mjs'
      - 'experiments/production-criticality-ranking/verify-mutation-evidence.test.mjs'
      - 'experiments/production-criticality-ranking/mutation-evidence.json'
      - '.github/workflows/production-criticality-mutation-probe.yml'
  workflow_dispatch:

concurrency:
  group: criticality-mutation-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      run_probe: ${{ steps.changed.outputs.run_probe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: evidence
        name: Check current mutation evidence blobs
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const snapshot=JSON.parse(fs.readFileSync('experiments/production-criticality-ranking/mutation-evidence.json','utf8'));
          let current=true;
          for(const probe of snapshot.probes??[]){
            for(const [file,expected] of Object.entries(probe.source_blobs??{})){
              const actual=execFileSync('git',['hash-object',file],{encoding:'utf8'}).trim();
              if(actual!==expected) current=false;
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`current=${current}\n`);
          NODE
      - id: changed
        name: Detect mutation-relevant change
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || '' }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_CURRENT: ${{ steps.evidence.outputs.current }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_probe=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE" || -z "$HEAD" ]]; then
            echo "mutation probe cannot establish the full pull-request revision range" >&2
            exit 1
          fi
          if git diff --name-only "$BASE" "$HEAD" -- \
            experiments/production-criticality-ranking/mutation-probes.json \
            experiments/production-criticality-ranking/resolve-mutation-probes.mjs \
            experiments/production-criticality-ranking/stryker.config.mjs \
            experiments/production-criticality-ranking/summarize-mutation.mjs \
            experiments/production-criticality-ranking/summarize-mutation.test.mjs \
            experiments/production-criticality-ranking/emit-mutation-evidence.mjs | grep -q .; then
            echo "run_probe=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" -- \
            src/digest.ts \
            src/semantic-identity.ts \
            src/projector.ts \
            src/kernel-core.ts \
            src/observation.ts | grep -q .; then
            if [[ "$EVIDENCE_CURRENT" == "true" ]]; then
              echo "run_probe=false" >> "$GITHUB_OUTPUT"
            else
              echo "run_probe=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "run_probe=false" >> "$GITHUB_OUTPUT"

  mutate:
    needs: detect
    if: needs.detect.outputs.run_probe == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Install pinned mutation engine
        run: npm install --no-save --ignore-scripts @stryker-mutator/core@10.0.0 typescript@5.8.3
      - name: Resolve semantic mutation probes
        run: node experiments/production-criticality-ranking/resolve-mutation-probes.mjs mutation-ranges.json
      - name: Prove mutation summarizer
        run: node --test experiments/production-criticality-ranking/summarize-mutation.test.mjs
      - name: Probe hostile mutations
        run: npx stryker run experiments/production-criticality-ranking/stryker.config.mjs
      - name: Summarize semantic regions
        if: always()
        run: |
          if [[ -f mutation.json ]]; then
            node experiments/production-criticality-ranking/summarize-mutation.mjs mutation.json mutation-ranges.json mutation-summary.md
          fi
      - name: Emit revision-bound mutation evidence
        if: always()
        run: |
          if [[ -f mutation.json && -f mutation-ranges.json ]]; then
            node experiments/production-criticality-ranking/emit-mutation-evidence.mjs \
              --report mutation.json \
              --ranges mutation-ranges.json \
              --output mutation-evidence-generated.json \
              --workflow-run-id "$GITHUB_RUN_ID"
          fi
      - name: Show mutation summary
        if: always()
        run: cat mutation-summary.md || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-criticality-mutation-probe
          path: |
            mutation.json
            mutation-ranges.json
            mutation-summary.md
            mutation-evidence-generated.json
          if-no-files-found: ignore

  verify-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove evidence verifier
        run: node --test experiments/production-criticality-ranking/verify-mutation-evidence.test.mjs
      - id: source
        name: Verify cited workflow authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const evidence=JSON.parse(fs.readFileSync('experiments/production-criticality-ranking/mutation-evidence.json','utf8'));
          const runId=evidence.source_run?.workflow_run_id;
          const revision=evidence.source_run?.revision;
          const artifactDigest=evidence.source_run?.artifact_digest;
          if(!Number.isInteger(runId)||runId<=0||!/^[0-9a-f]{40}$/.test(revision??'')||!/^sha256:[0-9a-f]{64}$/.test(artifactDigest??'')) throw new Error('invalid mutation evidence source-run identity');
          const headers={
            Accept:'application/vnd.github+json',
            Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version':'2022-11-28',
          };
          const get=async url=>{
            const response=await fetch(url,{headers});
            if(!response.ok) throw new Error(`GitHub API ${response.status} for ${url}`);
            return response.json();
          };
          const base=`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
          const run=await get(`${base}/actions/runs/${runId}`);
          if(run.path!=='.github/workflows/production-criticality-mutation-probe.yml') throw new Error(`unexpected evidence workflow: ${run.path}`);
          if(run.head_sha!==revision) throw new Error(`evidence revision mismatch: ${run.head_sha} != ${revision}`);
          const jobs=await get(`${base}/actions/runs/${runId}/jobs?per_page=100`);
          const mutate=jobs.jobs?.find(job=>job.name==='mutate');
          if(mutate?.conclusion!=='success') throw new Error(`authoritative mutate job did not succeed: ${mutate?.conclusion??'missing'}`);
          const artifacts=await get(`${base}/actions/runs/${runId}/artifacts?per_page=100`);
          const artifact=artifacts.artifacts?.find(item=>item.name==='production-criticality-mutation-probe'&&!item.expired);
          if(!artifact) throw new Error('authoritative mutation artifact is missing or expired');
          if(!/^sha256:[0-9a-f]{64}$/.test(artifact.digest??'')) throw new Error('authoritative mutation artifact has no digest');
          if(artifactDigest!==artifact.digest){
            throw new Error(`mutation artifact digest mismatch: ${artifact.digest} != ${artifactDigest}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run_id=${runId}\n`);
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-criticality-mutation-probe
          path: authoritative-mutation-evidence
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Bind checked-in evidence to authoritative artifact
        run: node experiments/production-criticality-ranking/verify-mutation-evidence.mjs

