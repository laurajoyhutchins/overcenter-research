name: Criticality mutation probe

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'experiments/production-criticality-ranking/**'
      - '.github/workflows/production-criticality-mutation-probe.yml'
  pull_request:
    types: [ready_for_review]
    paths:
      - 'src/**'
      - 'test/**'
      - 'experiments/production-criticality-ranking/mutation-probes.json'
      - 'experiments/production-criticality-ranking/resolve-mutation-probes.mjs'
      - 'experiments/production-criticality-ranking/stryker.config.mjs'
      - 'experiments/production-criticality-ranking/summarize-mutation.mjs'
      - 'experiments/production-criticality-ranking/summarize-mutation.test.mjs'
      - 'experiments/production-criticality-ranking/emit-mutation-evidence.mjs'
      - 'experiments/production-criticality-ranking/mutation-evidence.mjs'
      - 'experiments/production-criticality-ranking/mutation-evidence.test.mjs'
      - 'experiments/production-criticality-ranking/verify-mutation-evidence-sources.mjs'
      - 'experiments/production-criticality-ranking/select-mutation-probe.mjs'
      - 'experiments/production-criticality-ranking/select-mutation-probe.test.mjs'
      - 'experiments/production-criticality-ranking/verify-mutation-evidence.mjs'
      - 'experiments/production-criticality-ranking/verify-mutation-evidence.test.mjs'
      - 'experiments/production-criticality-ranking/mutation-evidence.json'
      - '.github/workflows/production-criticality-mutation-probe.yml'
  workflow_dispatch:

concurrency:
  group: criticality-mutation-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      run_probe: ${{ steps.changed.outputs.run_probe }}
      mutation_probe: ${{ steps.changed.outputs.mutation_probe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Prove mutation selector
        run: node --test experiments/production-criticality-ranking/select-mutation-probe.test.mjs
      - id: changed
        name: Detect mutation-relevant change
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            node experiments/production-criticality-ranking/select-mutation-probe.mjs "$EVENT_NAME" </dev/null >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE" || -z "$HEAD" ]]; then
            echo "mutation probe cannot establish the full pull-request revision range" >&2
            exit 1
          fi
          git diff --name-only "$BASE" "$HEAD" \
            | node experiments/production-criticality-ranking/select-mutation-probe.mjs "$EVENT_NAME" \
            >> "$GITHUB_OUTPUT"

      - name: Prove evidence machinery
        run: |
          node --test \
            experiments/production-criticality-ranking/mutation-evidence.test.mjs \
            experiments/production-criticality-ranking/verify-mutation-evidence.test.mjs
      - name: Bind checked-in evidence to authoritative artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node experiments/production-criticality-ranking/verify-mutation-evidence-sources.mjs
  mutate:
    needs: preflight
    if: needs.preflight.outputs.run_probe == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MUTATION_PROBE: ${{ needs.preflight.outputs.mutation_probe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - id: mutation-tools
        name: Restore pinned mutation tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: mutation-tools-${{ runner.os }}-${{ hashFiles('.node-version', 'package.json') }}-stryker-10.0.0-typescript-5.8.3
      - name: Install pinned mutation engine
        if: steps.mutation-tools.outputs.cache-hit != 'true'
        run: npm install --no-save --ignore-scripts @stryker-mutator/core@10.0.0 typescript@5.8.3
      - name: Resolve semantic mutation probes
        run: node experiments/production-criticality-ranking/resolve-mutation-probes.mjs mutation-ranges.json
      - name: Prove mutation summarizer
        run: node --test experiments/production-criticality-ranking/summarize-mutation.test.mjs
      - name: Probe hostile mutations
        run: ./node_modules/.bin/stryker run experiments/production-criticality-ranking/stryker.config.mjs
      - name: Summarize semantic regions
        if: always()
        run: |
          if [[ -f mutation.json ]]; then
            node experiments/production-criticality-ranking/summarize-mutation.mjs mutation.json mutation-ranges.json mutation-summary.md
          fi
      - name: Emit revision-bound mutation evidence
        if: always()
        run: |
          if [[ -f mutation.json && -f mutation-ranges.json ]]; then
            node experiments/production-criticality-ranking/emit-mutation-evidence.mjs \
              --report mutation.json \
              --ranges mutation-ranges.json \
              --output mutation-evidence-generated.json \
              --workflow-run-id "$GITHUB_RUN_ID"
          fi
      - name: Show mutation summary
        if: always()
        run: cat mutation-summary.md || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-criticality-mutation-probe
          path: |
            mutation.json
            mutation-ranges.json
            mutation-summary.md
            mutation-evidence-generated.json
          if-no-files-found: ignore

