name: Overcenter self-application

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overcenter-self-application-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  self-evidence:
    name: Self-host deterministic evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: '.go-version'
          cache: false
      - name: Prove self-application
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/overcenter-self-application.json"
          image="overcenter-self-application:${{ github.run_id }}"
          bash scripts/proof-self-application.sh "$SOURCE_SHA" "$image" "$report"
          {
            echo '## Overcenter self-application'
            echo
            echo '### Report'
            sed 's/^/    /' "$report"
          } >> "$GITHUB_STEP_SUMMARY"
