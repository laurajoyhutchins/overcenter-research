name: Overcenter self-application

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overcenter-self-application-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  self-evidence:
    name: Self-host deterministic evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: '.go-version'
          cache: false
      - name: Build isolated self-application executor
        run: |
          set -euo pipefail
          go_version="$(tr -d '\r\n' < .go-version)"
          test "$(go env GOVERSION)" = "go${go_version}"
          rm -rf .overcenter-build
          mkdir -p .overcenter-build
          (
            cd executor
            CGO_ENABLED=0 go build -trimpath -buildvcs=false \
              -o ../.overcenter-build/overcenter-executor \
              ./cmd/overcenter-executor
          )
          docker build \
            --build-arg NODE_IMAGE="$(node -e "const x=require('./executor/runtime-images.json'); process.stdout.write(x.node_self_application)")" \
            --build-arg NODE_VERSION="$(cat .node-version)" \
            -f executor/self-application/Dockerfile \
            -t "overcenter-self-application:${{ github.run_id }}" \
            .
      - name: Let Overcenter verify this exact revision
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/overcenter-self-application.json"
          node --experimental-strip-types bin/self-application-evidence.ts \
            --image "overcenter-self-application:${{ github.run_id }}" \
            --source-sha "$SOURCE_SHA" \
            --report "$report"
          {
            echo '## Overcenter self-application'
            echo
            echo '### Report'
            sed 's/^/    /' "$report"
          } >> "$GITHUB_STEP_SUMMARY"
