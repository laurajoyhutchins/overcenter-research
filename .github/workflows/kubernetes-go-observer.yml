name: Go Kubernetes observer experiment

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/go-kubernetes-observer
    paths:
      - .github/workflows/kubernetes-go-observer.yml
      - experiments/kubernetes-go-observer/**
      - test/kubernetes-go-observer.test.ts
      - src/providers/kubernetes-configmap.ts
      - src/provider-observation/**
      - src/model.ts
      - src/evidence.ts
      - src/digest.ts
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/kubernetes-go-observer.yml
      - experiments/kubernetes-go-observer/**
      - test/kubernetes-go-observer.test.ts
      - src/providers/kubernetes-configmap.ts
      - src/provider-observation/**
      - src/model.ts
      - src/evidence.ts
      - src/digest.ts

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Acquisition/semantics boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: experiments/kubernetes-go-observer/go.mod
          cache: false
      - name: Repository regression
        run: npm test
      - name: Go acquisition adversaries
        working-directory: experiments/kubernetes-go-observer
        run: go test ./...
      - name: Cross-language semantic boundary
        run: node --experimental-strip-types --test test/kubernetes-go-observer.test.ts
