name: Ambient authority boundary proof

on:
  workflow_dispatch:
  pull_request:
    types: [ready_for_review]
    paths:
      - .github/workflows/ambient-authority-boundary.yml
      - experiments/ambient-authority-boundary/**
      - experiments/proof-environment.ts
      - src/git-kernel.ts
      - src/providers/github-status-effect.ts

permissions: {}

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  project-authority:
    name: Trusted project authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Run deterministic boundary witness
        run: npm run test:ambient-authority-boundary
      - name: Define and claim exact work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/ambient-authority-boundary/authority.ts

  controlled-worker:
    name: Controlled worker — provider write denied
    needs: project-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      packet_sha256: ${{ steps.worker.outputs.packet_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Attempt provider mutation without host capability
        id: worker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/ambient-authority-boundary/controlled-worker.ts

  foreign-worker:
    name: Foreign worker — ambient provider write succeeds
    needs: controlled-worker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Use host-provided provider capability
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTROL_PACKET_SHA256: ${{ needs.controlled-worker.outputs.packet_sha256 }}
        run: node --experimental-strip-types experiments/ambient-authority-boundary/foreign-worker.ts

  trusted-recovery:
    name: Trusted readback and settlement
    needs: foreign-worker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Reconstruct, observe, and settle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types experiments/ambient-authority-boundary/recovery.ts
