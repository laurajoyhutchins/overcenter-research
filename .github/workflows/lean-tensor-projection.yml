name: Lean typed tensor projection

on:
  workflow_dispatch:
  pull_request:
    paths:
      - experiments/lean-kernel/**
      - experiments/semantic-kernel-language-comparison/LEAN_TENSOR_PROJECTION.md
      - experiments/semantic-kernel-language-comparison/tensor-projection-differential.test.ts
      - experiments/semantic-kernel-language-comparison/typed-tensor-two-hop.py
      - src/digest.ts
      - .github/workflows/lean-tensor-projection.yml
  push:
    branches:
      - experiment/lean-tensor-projection
    paths:
      - experiments/lean-kernel/**
      - experiments/semantic-kernel-language-comparison/LEAN_TENSOR_PROJECTION.md
      - experiments/semantic-kernel-language-comparison/tensor-projection-differential.test.ts
      - experiments/semantic-kernel-language-comparison/typed-tensor-two-hop.py
      - src/digest.ts
      - .github/workflows/lean-tensor-projection.yml

permissions:
  contents: read

jobs:
  tensor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Node 22.16
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: Build Lean proof library
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: experiments/lean-kernel
          auto-config: false
          build: true
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
          leanchecker: false

      - name: Build graph tensor executable
        working-directory: experiments/lean-kernel
        run: lake build overcenterGraphTensor

      - name: Execute proof-bearing tensor projector
        run: ./experiments/lean-kernel/.lake/build/bin/overcenterGraphTensor

      - name: Differential tensor projection proof
        run: >-
          node --experimental-strip-types --test
          experiments/semantic-kernel-language-comparison/tensor-projection-differential.test.ts

      - name: Parent realization projection differential
        run: >-
          node --experimental-strip-types --test
          experiments/semantic-kernel-language-comparison/realization-projection-differential.test.ts
