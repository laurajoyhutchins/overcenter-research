name: Hostile eventual-readback proof

on:
  pull_request:
    paths:
      - 'src/**'
      - 'experiments/eventually-consistent-readback/eventually-consistent-effect.test.ts'
      - 'package.json'
      - 'research/eventually-consistent-readback-experiment.md'
      - '.github/workflows/hostile-effect-proof.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'experiments/eventually-consistent-readback/eventually-consistent-effect.test.ts'
      - 'package.json'
      - 'research/eventually-consistent-readback-experiment.md'
      - '.github/workflows/hostile-effect-proof.yml'

permissions:
  contents: read

jobs:
  eventual-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.16.0
      - name: Prove stale negative readback does not authorize replay
        run: npm run test:eventual
      - name: Run full regression suite
        run: npm test
