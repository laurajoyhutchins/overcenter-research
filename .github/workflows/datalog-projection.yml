name: Datalog projection

on:
  pull_request:
    paths:
      - 'experiments/datalog-projection/**'
      - 'src/lifecycle.ts'
      - 'src/eligibility.ts'
      - 'src/model.ts'
      - 'src/facts.ts'
      - '.github/workflows/datalog-projection.yml'
  push:
    branches:
      - main
    paths:
      - 'experiments/datalog-projection/**'
      - 'src/lifecycle.ts'
      - 'src/eligibility.ts'
      - 'src/model.ts'
      - 'src/facts.ts'
      - '.github/workflows/datalog-projection.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  differential:
    name: Datalog projection differential
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.PROOF_SOURCE_SHA }}
      - name: Verify exact proof revision
        run: test "$(git rev-parse HEAD)" = "$PROOF_SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Install Soufflé 2.5
        run: |
          curl -fsSLO https://github.com/souffle-lang/souffle/releases/download/2.5/x86_64-ubuntu-2404-souffle-2.5-Linux.deb
          echo 'c7e9dd1349506bbb23c4dcf89e87396198006235f79b1cc516c0a2b67ac067bc  ./x86_64-ubuntu-2404-souffle-2.5-Linux.deb' | sha256sum -c -
          sudo apt-get install -y ./x86_64-ubuntu-2404-souffle-2.5-Linux.deb
          souffle --version
      - run: node --experimental-strip-types --test experiments/datalog-projection/projection.test.ts
