name: History independence inference

on:
  pull_request:
    paths:
      - 'experiments/history-independence-inference/**'
      - '.github/workflows/history-independence-inference.yml'
      - 'src/authority/**'
      - 'src/graph/**'
      - 'src/providers/github/**'
      - 'src/semantics.ts'
      - 'src/effect-adapter.ts'
      - 'src/storage/sqlite.ts'
      - 'src/digest.ts'
      - 'package.json'
      - 'experiments/registry.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - run: npm install --ignore-scripts --package-lock=false
      - name: Run derived history independence treatment
        run: npm run test:history-independence-inference
