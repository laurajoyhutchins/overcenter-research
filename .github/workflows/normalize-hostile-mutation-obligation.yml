name: Normalize hostile mutation obligation

on:
  push:
    branches:
      - feat/hostile-mutation-obligation
    paths:
      - '.github/workflows/normalize-hostile-mutation-obligation.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/hostile-mutation-obligation
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Generate and format touched contracts
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false typebox@1.3.34
          node --experimental-strip-types scripts/generate-settlement-observation.ts --write
          npx --yes '@biomejs/biome@2.5.14' format --write \
            src/providers/github/hostile-mutation-evidence.ts \
            src/evidence/hostile-mutation-obligation.ts \
            src/model.ts \
            src/observation/observe.ts \
            contracts/observation-evidence/settlement-observation.typebox.ts \
            src/generated/settlement-observation-schema.ts \
            src/authority/project-agent-protocol.ts \
            src/cli/hostile-mutation-evidence-obligation.ts \
            test/hostile-mutation-evidence-obligation.test.ts \
            package.json
          rm .github/workflows/normalize-hostile-mutation-obligation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Normalize hostile mutation obligation contracts"
          git push origin HEAD:feat/hostile-mutation-obligation
