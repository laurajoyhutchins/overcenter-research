name: Lean semantic oracle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - test/lean-semantic-oracle.test.ts
      - .github/workflows/lean-semantic-oracle.yml
      - .node-version
      - formal/lean-semantic-oracle-revision.txt
      - docs/adr/0006-lean-semantic-reference-and-proof-oracle.md
      - research/proof-obligations.md
      - docs/adr/0006-lean-semantic-reference-and-proof-oracle.md
      - research/proof-obligations.md
  push:
    branches:
      - main
    paths:
      - src/**
      - test/lean-semantic-oracle.test.ts
      - .github/workflows/lean-semantic-oracle.yml
      - .node-version
      - formal/lean-semantic-oracle-revision.txt

permissions:
  contents: read

jobs:
  oracle:
    name: TypeScript vs Lean semantic oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LEAN_ORACLE_BIN: ./lean-oracle/experiments/lean-kernel/.lake/build/bin/overcenterClaimAdmissionComparisonServer
    steps:
      - name: Checkout production implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Assert exact production revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Resolve pinned oracle revision
        id: oracle-revision
        shell: bash
        run: |
          sha="$(tr -d '\r\n' < formal/lean-semantic-oracle-revision.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Lean semantic reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: laurajoyhutchins/overcenter-research
          ref: ${{ steps.oracle-revision.outputs.sha }}
          path: lean-oracle

      - name: Assert pinned oracle identity
        working-directory: lean-oracle
        env:
          EXPECTED_ORACLE_SHA: ${{ steps.oracle-revision.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_ORACLE_SHA"

      - name: Node 22.16
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean-oracle/experiments/lean-kernel
          auto-config: false
          build: true
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
          leanchecker: false

      - name: Build semantic comparison oracle
        working-directory: lean-oracle/experiments/lean-kernel
        run: lake build overcenterClaimAdmissionComparisonServer

      - name: Compare production semantics with Lean oracle
        env:
          LEAN_ORACLE_SHA: ${{ steps.oracle-revision.outputs.sha }}
        run: node --experimental-strip-types --test test/lean-semantic-oracle.test.ts
