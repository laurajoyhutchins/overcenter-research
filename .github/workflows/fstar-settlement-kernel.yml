name: F* settlement kernel

on:
  push:
    branches:
      - experiment/fstar-settlement-kernel
    paths:
      - "experiments/fstar-settlement-kernel/**"
      - ".github/workflows/fstar-settlement-kernel.yml"
      - ".github/actions/setup-fstar/**"
  pull_request:
    paths:
      - "experiments/fstar-settlement-kernel/**"
      - ".github/workflows/fstar-settlement-kernel.yml"
      - ".github/actions/setup-fstar/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-fstar

      - name: Verify settlement experiment
        run: bash experiments/fstar-settlement-kernel/check.sh
