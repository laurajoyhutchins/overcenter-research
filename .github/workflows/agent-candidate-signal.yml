name: Overcenter internal · candidate handoff

on:
  push:
    branches:
      - 'overcenter/candidate/**'

permissions: {}

jobs:
  classify:
    name: Classify candidate transport
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
      run_id: ${{ steps.classify.outputs.run_id }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Classify exact candidate
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          run_id="${GITHUB_REF_NAME#overcenter/candidate/}"
          test -n "$run_id"
          test "$run_id" != "$GITHUB_REF_NAME"

          changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          if [ "$changed" = ".overcenter/candidate.json" ]; then
            candidate_run_id="$(git show "$GITHUB_SHA:.overcenter/candidate.json" | node -e '
              let s="";
              process.stdin.on("data",d=>s+=d).on("end",()=>{
                const value=JSON.parse(s);
                if (typeof value.run_id!=="string" || !value.run_id) process.exit(2);
                process.stdout.write(value.run_id);
              });
            ')"
            test "$candidate_run_id" = "$run_id"
            kind="pure-candidate"
          else
            kind="source-change"
          fi

          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  signal:
    name: Internal candidate handoff
    needs: classify
    if: ${{ needs.classify.outputs.kind == 'pure-candidate' }}
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Emit no authority
        run: 'true'

  source-evidence:
    name: Verify source candidate
    needs: classify
    if: ${{ needs.classify.outputs.kind == 'source-change' }}
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      expensive: true

  source-record:
    name: Record source verification
    needs: [classify, source-evidence]
    if: ${{ always() && needs.classify.outputs.kind == 'source-change' }}
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      CANDIDATE_RUN_ID: ${{ needs.classify.outputs.run_id }}
      EVIDENCE_RESULT: ${{ needs.source-evidence.result }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Record exact verification result
        shell: bash
        run: |
          set -euo pipefail
          read -r commit parent extra < <(git rev-list --parents -n1 "$CANDIDATE_SHA")
          test "$commit" = "$CANDIDATE_SHA"
          test -n "$parent"
          test -z "${extra:-}"
          tree_sha="$(git rev-parse "$CANDIDATE_SHA^{tree}")"

          if [ "$EVIDENCE_RESULT" = "success" ]; then
            state="verified"
            reason=""
          else
            state="rejected"
            reason="SOURCE_VERIFICATION_FAILED"
            tree_sha=""
          fi

          mkdir -p source-verification
          STATE="$state" REASON="$reason" BASE_SHA="$parent" TREE_SHA="$tree_sha" node - <<'NODE'
          const fs = require('node:fs');
          const value = {
            schema: 'overcenter-source-verification/v1',
            state: process.env.STATE,
            run_id: process.env.CANDIDATE_RUN_ID,
            candidate_sha: process.env.CANDIDATE_SHA,
            base_sha: process.env.BASE_SHA,
            tree_sha: process.env.TREE_SHA || null,
            reason: process.env.REASON || null,
          };
          fs.writeFileSync(
            'source-verification/source-verification.json',
            JSON.stringify(value, null, 2) + '\n',
          );
          NODE

      - name: Publish source verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: overcenter-source-verification
          path: source-verification/source-verification.json
          if-no-files-found: error
          retention-days: 1
