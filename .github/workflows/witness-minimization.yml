name: Automatic witness minimization experiment

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/witness-minimization-20260923

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  evaluate:
    name: Blind witness discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact experiment revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Verify experiment contract
        run: npm run test:experiment-contract
      - name: Run blind minimization and challenge corpus
        run: |
          set -euo pipefail
          npm run test:witness-minimization | tee "$RUNNER_TEMP/witness-minimization.txt"
          {
            echo '## Automatic witness minimization'
            echo
            sed 's/^/    /' "$RUNNER_TEMP/witness-minimization.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run follow-on trial matrix
        run: |
          set -euo pipefail
          npm run test:witness-minimization:trials | tee "$RUNNER_TEMP/witness-minimization-trials.txt"
          {
            echo
            echo '## Follow-on trial matrix'
            echo
            sed 's/^/    /' "$RUNNER_TEMP/witness-minimization-trials.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Audit production mutation boundary
        run: |
          set -euo pipefail
          npm run test:witness-source-boundary | tee "$RUNNER_TEMP/witness-source-boundary.txt"
          {
            echo
            echo '## Production mutation-boundary audit'
            echo
            sed 's/^/    /' "$RUNNER_TEMP/witness-source-boundary.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Learn positive recovery proof
        run: |
          set -euo pipefail
          npm run test:witness-proof-learning | tee "$RUNNER_TEMP/witness-proof-learning.txt"
          {
            echo
            echo '## Learned positive recovery proof'
            echo
            sed 's/^/    /' "$RUNNER_TEMP/witness-proof-learning.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Bind learned proof to recovery authority
        run: |
          set -euo pipefail
          npm run test:witness-recovery-certificate | tee "$RUNNER_TEMP/witness-recovery-certificate.txt"
          {
            echo
            echo '## Authority-bound recovery certificate'
            echo
            sed 's/^/    /' "$RUNNER_TEMP/witness-recovery-certificate.txt"
          } >> "$GITHUB_STEP_SUMMARY"
