name: Repair PR 290
on:
  push:
    branches:
      - chore/sensible-lint

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PARENT: e73c766993ae0a3b1b599e3e16e0d5ea08af3393
      MAIN_SHA: a22f91aaeee693ec9e0e648301ab74c9768a4b19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Fence repair inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .go-version
          cache: false

      - name: Install Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --no-self-update
          test "$(rustc --version | awk '{print $2}')" = "$channel"

      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-ff --no-commit -Xtheirs "$MAIN_SHA"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
            printf 'unresolved=%s\n' "${unresolved[*]}"
            test "${#unresolved[@]}" -eq 1
            test "${unresolved[0]}" = "contracts/observation-evidence-v1/settlement-observation.typebox.ts"
            git rm -- "contracts/observation-evidence-v1/settlement-observation.typebox.ts"
          fi

          # For paths changed by both sides, keep current main's semantics exactly.
          # The PR's formatter is reapplied to these files in the next step.
          git checkout "$MAIN_SHA" -- \
            .github/workflows/tests.yml \
            package.json \
            scripts/experiments.ts \
            scripts/generate-settlement-observation.ts \
            scripts/self-application-evidence.ts \
            src/authority/engine.ts \
            src/authority/project-state.ts \
            src/authority/replay.ts \
            src/execution/assignment-capsule.ts \
            src/execution/confined-executor.ts \
            src/execution/executor/containment/driver.ts \
            src/execution/go-client.ts \
            src/execution/protocol.ts \
            src/execution/runner.ts \
            src/model.ts \
            src/observation/provider.ts \
            src/providers/github/certified-status.ts \
            src/providers/github/pr-update-branch-effect.ts \
            src/providers/github/status-effect.ts \
            test/computation-executor.test.ts \
            test/data-contracts.test.ts \
            test/fixtures/computation-child.ts \
            test/git-kernel.test.ts \
            test/github-certified-status.test.ts \
            test/github-pr-update-branch-effect.test.ts \
            test/github-status-effect.test.ts \
            test/projection-pure.test.ts \
            test/projector-pure.test.ts \
            test/realization-admissibility.test.ts \
            test/semantic-identity-hostile.test.ts \
            test/typebox-production-contract.test.ts \
            test/typebox-production-projection.test.ts

          test -f contracts/observation-evidence/settlement-observation.typebox.ts

      - name: Reapply lint integration
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts.lint = 'bash scripts/lint.sh';
          pkg.scripts.format = 'bash scripts/format.sh';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          python3 <<'PY'
          from pathlib import Path
          import re

          confined = Path('src/execution/confined-executor.ts')
          confined_text = confined.read_text()
          typed_child = '    let child: ReturnType<typeof spawn>;'
          if typed_child not in confined_text:
              if confined_text.count('    let child;') != 1:
                  raise SystemExit('unexpected confined child declaration')
              confined_text = confined_text.replace('    let child;', typed_child, 1)
              confined.write_text(confined_text)

          path = Path('.github/workflows/tests.yml')
          text = path.read_text()

          text = re.sub(
              r"      - name: Install Go for candidate production evidence\n.*?(?=      - name: Prove production computation boundary\n)",
              "",
              text,
              count=1,
              flags=re.S,
          )

          if "      - name: Lint source\n" not in text:
              marker = (
                  "      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7\n"
                  "        with:\n"
                  "          node-version-file: '.node-version'\n"
              )
              insert = marker + (
                  "      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7\n"
                  "        with:\n"
                  "          go-version-file: '.go-version'\n"
                  "          cache: false\n"
                  "      - name: Install pinned Rust toolchain\n"
                  "        shell: bash\n"
                  "        run: |\n"
                  "          set -euo pipefail\n"
                  "          channel=\"$(sed -n 's/^channel = \\\"\\([^\\\"]*\\)\\\"$/\\1/p' rust-toolchain.toml)\"\n"
                  "          test -n \"$channel\"\n"
                  "          rustup toolchain install \"$channel\" --profile minimal --component rustfmt --no-self-update\n"
                  "          test \"$(rustc --version | awk '{print $2}')\" = \"$channel\"\n"
                  "      - name: Lint source\n"
                  "        run: npm run lint\n"
              )
              if marker not in text:
                  raise SystemExit('setup-node marker not found')
              text = text.replace(marker, insert, 1)

          path.write_text(text)
          PY

      - name: Format reconciled source
        run: npm run format

      - name: Install TypeScript toolchain
        run: npm install --ignore-scripts --package-lock=false

      - name: Remove one-shot repair workflow
        run: git rm -- .github/workflows/repair-pr-290.yml

      - name: Verify repaired tree
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm test
          test ! -e contracts/observation-evidence-v1/settlement-observation.typebox.ts
          test -e contracts/observation-evidence/settlement-observation.typebox.ts

      - name: Commit repaired branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "chore: reconcile lint gate with current main"
          git push origin HEAD:chore/sensible-lint
