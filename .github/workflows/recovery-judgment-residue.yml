name: Recovery judgment residue experiment

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'experiments/recovery-judgment-residue/**'
      - 'experiments/recovery-reasoning/recovery-gate.ts'
      - '.github/workflows/recovery-judgment-residue.yml'
      - 'package.json'
      - 'experiments/registry.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-judgment-residue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Deterministic residue boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - run: npm run test:recovery-judgment-residue
