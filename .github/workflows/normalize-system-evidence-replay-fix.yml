name: Normalize system evidence replay fix

on:
  push:
    branches:
      - fix/system-evidence-authority-replay
    paths:
      - '.github/workflows/normalize-system-evidence-replay-fix.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/system-evidence-authority-replay
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Regenerate and format
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --package-lock=false typebox@1.3.34
          node --experimental-strip-types scripts/generate-settlement-observation.ts --write
          mapfile -t files < <(
            git ls-files '*.ts' biome.json package.json \
              | grep -v '^src/generated/' \
              | grep -v '^src/providers/github/operations\.generated\.ts$'
          )
          npx --yes '@biomejs/biome@2.5.14' format --write "${files[@]}"
          rm .github/workflows/normalize-system-evidence-replay-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Normalize replay-stable system evidence"
          git push origin HEAD:fix/system-evidence-authority-replay
