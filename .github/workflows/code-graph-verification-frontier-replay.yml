name: Code graph verification frontier replay

on:
  push:
    branches:
      - run/code-graph-replay-bounded
    paths:
      - .github/workflows/code-graph-verification-frontier-replay.yml

permissions:
  actions: read
  contents: read

jobs:
  replay:
    name: Replay repaired frontier
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact graph revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch Flask history
        run: git clone --filter=blob:none https://github.com/pallets/flask.git /tmp/flask

      - name: Restore frozen preflight
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code-graph-preflight
          path: ${{ runner.temp }}/preflight
          github-token: ${{ github.token }}
          run-id: 35739887949

      - name: Restore immutable oracle evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: code-graph-case-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 35739887949

      - name: Replay frontier mechanics
        run: |
          npm run experiment:code-graph-replay-frontiers -- \
            --flask-repo /tmp/flask \
            --results "$RUNNER_TEMP/results"

      - name: Rescore immutable outcomes
        run: |
          npm run experiment:code-graph-rescore -- \
            --results "$RUNNER_TEMP/results"

      - name: Aggregate frozen gates
        run: |
          npm run experiment:code-graph-summarize -- \
            --results "$RUNNER_TEMP/results" \
            --preflight "$RUNNER_TEMP/preflight/code-graph-preflight.json" \
            --out "$RUNNER_TEMP/code-graph-summary.json"

      - name: Publish compact result
        env:
          SUMMARY: ${{ runner.temp }}/code-graph-summary.json
        run: |
          python3 - <<'PY'
          import json
          import os

          report = json.load(open(os.environ["SUMMARY"], encoding="utf-8"))
          compact = {
              "raw_runs": report["raw_runs"],
              "effective_observations": report["effective_observations"],
              "totals": report["totals"],
              "metrics": report["metrics"],
              "gates": report["gates"],
              "hypothesis_survived": report["hypothesis_survived"],
          }
          print(json.dumps(compact, sort_keys=True))
          PY

      - name: Preserve replay summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-graph-frontier-replay-summary
          path: ${{ runner.temp }}/code-graph-summary.json
          if-no-files-found: error
          retention-days: 30
