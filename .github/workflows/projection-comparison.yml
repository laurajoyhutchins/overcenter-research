name: Projection implementation comparison

on:
  pull_request:
    paths:
      - 'experiments/projection-comparison/**'
      - 'src/projector.ts'
      - 'src/semantic-identity.ts'
      - 'package.json'
      - '.github/workflows/projection-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.PROOF_SOURCE_SHA }}
      - name: Verify exact experiment revision
        run: test "$(git rev-parse HEAD)" = "$PROOF_SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Install Soufflé 2.5
        run: |
          curl -fsSLO https://github.com/souffle-lang/souffle/releases/download/2.5/x86_64-ubuntu-2404-souffle-2.5-Linux.deb
          echo 'c7e9dd1349506bbb23c4dcf89e87396198006235f79b1cc516c0a2b67ac067bc  ./x86_64-ubuntu-2404-souffle-2.5-Linux.deb' | sha256sum -c -
          sudo apt-get install -y ./x86_64-ubuntu-2404-souffle-2.5-Linux.deb
          souffle --version
      - run: npm run test:projection-comparison
