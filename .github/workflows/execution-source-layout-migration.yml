name: Temporary execution source-layout migration

on:
  push:
    branches:
      - refactor/execution-source-layout

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refactor/execution-source-layout
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Migrate native execution sources
        shell: bash
        run: |
          set -euo pipefail

          echo '== old path references before migration =='
          git grep -n -E 'runtime/overcenter-exec|(^|[^[:alnum:]_-])executor/' -- . || true

          test -d executor
          test -d runtime/overcenter-exec
          test ! -e src/execution/executor
          test ! -e src/execution/confinement

          git mv executor src/execution/executor
          git mv runtime/overcenter-exec src/execution/confinement
          rmdir runtime

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          for name in filter(None, files):
              path = Path(name)
              try:
                  raw = path.read_bytes()
                  text = raw.decode('utf-8')
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              updated = text.replace('runtime/overcenter-exec', 'src/execution/confinement')
              updated = re.sub(
                  r'(?<!src/execution/)(?<![A-Za-z0-9_-])executor/',
                  'src/execution/executor/',
                  updated,
              )
              exact = {
                  "join(repoRoot,'executor')": "join(repoRoot,'src/execution/executor')",
                  'join(repoRoot,"executor")': 'join(repoRoot,"src/execution/executor")',
                  'cd executor': 'cd src/execution/executor',
                  'working-directory: executor': 'working-directory: src/execution/executor',
                  'working-directory: ./executor': 'working-directory: ./src/execution/executor',
                  '-C executor': '-C src/execution/executor',
              }
              for old, new in exact.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)

          go_readme = Path('src/execution/executor/README.md')
          text = go_readme.read_text()
          text = text.replace('](../src/execution/containment.ts)', '](../containment.ts)')
          text = text.replace('](../.go-version)', '](../../../.go-version)')
          go_readme.write_text(text)

          rust_proof = Path('src/execution/confinement/proof.sh')
          text = rust_proof.read_text()
          text = text.replace(
              'repo_root="$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)"',
              'repo_root="$(cd "$(dirname "${BASH_SOURCE[0]}")/../../.." && pwd)"',
          )
          rust_proof.write_text(text)

          supervisor = Path('src/execution/confinement/supervisor_proof.ts')
          text = supervisor.read_text()
          text = text.replace(
              "from '../../src/execution/confined-executor.ts'",
              "from '../confined-executor.ts'",
          )
          text = text.replace(
              "from '../../src/execution/manifest.ts'",
              "from '../manifest.ts'",
          )
          supervisor.write_text(text)

          layout = Path('test/source-layout.test.ts')
          text = layout.read_text()
          text = text.replace(
              "import {readdirSync} from 'node:fs';",
              "import {existsSync,readdirSync} from 'node:fs';",
          )
          addition = """

          test('native execution implementations live beneath the execution namespace',()=>{
            assert.deepEqual(entries('src/execution'),[
              'assignment-capsule.ts',
              'confined-executor.ts',
              'confinement/',
              'containment.ts',
              'context.ts',
              'executor/',
              'go-client.ts',
              'manifest.ts',
              'protocol.ts',
              'runner.ts',
            ]);
            assert.equal(existsSync('executor'),false);
            assert.equal(existsSync('runtime'),false);
          });
          """
          if "native execution implementations live beneath the execution namespace" not in text:
              text = text.rstrip() + addition
          layout.write_text(text)

          source_readme = Path('src/README.md')
          text = source_readme.read_text()
          text = text.replace(
              "├── execution/      authorized computation, confinement, and executor transport",
              "├── execution/      authorized computation, confinement, and executor transport\n"
              "│   ├── executor/   Go physical computation executor\n"
              "│   └── confinement/ Rust native worker-confinement substrate",
          )
          source_readme.write_text(text)
          PY

          echo '== stale root path references after migration =='
          if git grep -n 'runtime/overcenter-exec' -- .; then
            echo 'stale runtime/overcenter-exec path remains' >&2
            exit 1
          fi

          if git grep -n -E "(join\(repoRoot,['\"]executor['\"]\)|cd executor([[:space:]]|$)|working-directory:[[:space:]]+(\./)?executor([[:space:]]|$)|-C executor([[:space:]]|$))" -- .; then
            echo 'stale root executor directory reference remains' >&2
            exit 1
          fi

          npm test

          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Move native execution sources under src"
          git push origin HEAD:refactor/execution-source-layout
