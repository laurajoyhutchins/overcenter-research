name: Kubernetes observation semantics proof

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/kubernetes-observation-semantics
      - experiment/provider-certificate-reuse
      - experiment/kubernetes-core-verifier
    paths:
      - .github/workflows/kubernetes-observation-semantics.yml
      - experiments/kubernetes-observation/**
      - experiments/provider-observation/**
      - src/provider-observation/**
      - src/providers/kubernetes-configmap.ts
      - src/model.ts
      - src/observation.ts
      - src/semantics.ts
      - src/projection.ts
      - src/git-kernel.ts
      - test/kubernetes-core-verifier.test.ts
      - research/kubernetes-observation-semantics.md
      - research/kubernetes-core-verifier.md
      - research/provider-observation-reuse.md
      - package.json
  pull_request:
    types: [ready_for_review]
    branches:
      - main
    paths:
      - .github/workflows/kubernetes-observation-semantics.yml
      - experiments/kubernetes-observation/**
      - experiments/provider-observation/**
      - src/provider-observation/**
      - src/providers/kubernetes-configmap.ts
      - src/model.ts
      - src/observation.ts
      - src/semantics.ts
      - src/projection.ts
      - src/git-kernel.ts
      - test/kubernetes-core-verifier.test.ts
      - research/kubernetes-observation-semantics.md
      - research/kubernetes-core-verifier.md
      - research/provider-observation-reuse.md
      - package.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-semantics:
    # The exact-head Merge gate already runs these deterministic regressions.
    # Candidate PRs retain only the distinct live-provider proof below.
    if: ${{ github.event_name != 'pull_request' }}
    name: Deterministic Kubernetes observation semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Fast repository regression
        run: npm test
      - name: Shared observation certificate adversaries
        run: npm run test:provider-observation
      - name: Kubernetes observation experiment
        run: npm run test:kubernetes-observation
      - name: Kubernetes core verifier adversaries
        run: npm run test:kubernetes-core

  live-provider:
    name: Live Kubernetes provider proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'
      - name: Install pinned kind and kubectl
        run: |
          curl --fail --location --retry 3 \
            https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64 \
            --output "$RUNNER_TEMP/kind"
          chmod +x "$RUNNER_TEMP/kind"
          sudo mv "$RUNNER_TEMP/kind" /usr/local/bin/kind

          curl --fail --location --retry 3 \
            https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl \
            --output "$RUNNER_TEMP/kubectl"
          chmod +x "$RUNNER_TEMP/kubectl"
          sudo mv "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl
      - name: Create pinned Kubernetes cluster
        run: |
          kind create cluster \
            --image kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f \
            --wait 120s
          kubectl version
      - name: Run live Kubernetes observation proof
        run: node --experimental-strip-types experiments/kubernetes-observation/live-proof.ts
      - name: Run live Kubernetes core settlement proof
        run: node --experimental-strip-types experiments/kubernetes-observation/live-core-proof.ts
